id: py_logging_dict_message
language: python
severity: warning
message: "Log a dictionary such as `{\"action\": \"save\", \"status\": \"run\"}` instead of a format string."
note: "Only calls on a receiver named `logger`, `log` or `logging` (or such a field) are judged. A call without arguments is skipped."
rule:
  kind: call
  all:
    - has:
        field: function
        kind: attribute
        regex: ^(self\.)?_?(logger|log|logging)\.(debug|info|warning|warn|error|exception|critical)$
    - has:
        field: arguments
        kind: argument_list
        has:
          nthChild: 1
          not:
            any:
              - kind: dictionary
              - kind: keyword_argument
