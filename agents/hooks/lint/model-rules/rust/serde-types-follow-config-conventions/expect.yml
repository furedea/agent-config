default: clean
# Lines are the struct line; a window of 1 keeps neighbouring subjects apart.
# violating.rs: every subject breaks the rule. conforming.rs: every subject keeps it, and most sit near the boundary
# that the criteria's false side names.
fixtures/violating.rs:
  - { line: 6, label: bad, window: 1 }
  - { line: 14, label: bad, window: 1 }
  - { line: 26, label: bad, window: 1 }
  - { line: 34, label: bad, window: 1 }
fixtures/conforming.rs:
  - { line: 6, label: clean, window: 1 }
  - { line: 16, label: clean, window: 1 }
  - { line: 26, label: clean, window: 1 }
  - { line: 35, label: clean, window: 1 }
  - { line: 43, label: clean, window: 1 }
