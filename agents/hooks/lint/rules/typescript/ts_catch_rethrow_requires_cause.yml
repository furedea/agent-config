id: ts_catch_rethrow_requires_cause
language: typescript
severity: error
message: "A new Error thrown inside a catch without `cause` hides the original error and its stack."
note: "Write `throw new Error(\"read config\", { cause: error })` instead of `throw new Error(\"read config\")`."
rule:
  all:
    - any:
        - pattern: new $ERROR($MESSAGE)
        - pattern: new $ERROR($MESSAGE, $OPTIONS)
    - inside:
        kind: throw_statement
        inside:
          any:
            - kind: catch_clause
              has: { field: parameter, regex: '.' }
            - all:
                - any:
                    - kind: arrow_function
                    - kind: function_expression
                - any:
                    - has: { field: parameter, regex: '.' }
                    - has: { field: parameters, regex: '^\(\s*[^\s)]' }
                - inside:
                    kind: arguments
                    inside:
                      kind: call_expression
                      has: { field: function, kind: member_expression, regex: '\.catch$' }
          stopBy:
            any:
              - kind: function_declaration
              - kind: function_expression
              - kind: arrow_function
              - kind: method_definition
constraints:
  ERROR: { regex: Error$ }
  OPTIONS:
    kind: object
    not: { regex: '\bcause\b' }
