id: bash_local_underscore_prefix
language: bash
severity: error
message: "Prefix function-local variables with `_`."
note: "Rename the declared name and its uses after the declaration, but not an outer variable read on the right-hand side, e.g. `local src=\"$1\"` to `local _src=\"$1\"`. Names starting with an uppercase letter are skipped: they localize special variables such as IFS, OPTIND, and LC_ALL, which cannot be renamed."
rule:
  any:
    - all:
        - kind: variable_assignment
        - regex: ^[^_A-Z]
    - all:
        - kind: variable_name
        - regex: ^[^_A-Z]
  inside:
    kind: declaration_command
    regex: ^local\b
