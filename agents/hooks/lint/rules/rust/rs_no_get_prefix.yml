id: rs_no_get_prefix
language: rust
severity: warning
message: "Avoid a Java-style `get_` prefix; name the accessor after the value (`len`, `status`) or use `as_*` / `into_*`."
rule:
  all:
    - kind: function_item
    - has:
        field: name
        kind: identifier
        regex: ^get_.
        not:
          regex: ^get_(mut|unchecked|unchecked_mut)$
    # A trait implementation cannot rename the method the trait fixes.
    - not:
        inside:
          kind: impl_item
          stopBy: end
          has:
            field: trait
            regex: .
