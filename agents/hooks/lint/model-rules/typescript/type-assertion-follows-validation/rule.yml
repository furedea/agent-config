# `as` is used only immediately after validation (agents/skills/typescript-style/references/types.md).
# `as const` is not an assertion about a type that could be wrong. Advisory.
id: type-assertion-follows-validation
languages: [ TypeScript, Tsx ]
kind: noul
subject: node
# The whole file: the check that justifies the assertion is often in another function of the file (#196).
state: located
# The cutoff is jev-lint's fitted midpoint on this folder's fixtures (4 violations, 4 conforming cases, 3 passes,
# means, #220): the highest conforming case scored 0.21 (0.22 in its worst pass) and the lowest violation 0.87 (0.86
# in its worst pass). A fit on so few cases is not a calibration, so the rule stays advisory (ADR-0021).
threshold: 0.54
inconclusive: >-
  Blind: every fixture is clearly clean or clearly defective (margins of 0.33 or more from the cutoff), and no
  boundary fixture exists yet; eight cases are too few to find one.
axis: file
severity: warning
rule:
  all:
    - kind: as_expression
    - not: { regex: '\bas\s+const$' }
ask: >-
  This `as` type assertion is not placed immediately after a check that makes it true.
criteria:
  "true": >-
    The asserted value was not validated by code just above it (a type guard, a parse function, a schema check, or an
    exhaustive test), so the assertion only silences the compiler, as in a cast of a parsed JSON value, an `any`, or an
    argument whose shape was never tested.
  "false": >-
    The assertion directly follows the check that justifies it, as the final step of a validating parse function that
    creates a branded type, or it is `as unknown` or a widening that cannot be wrong.
