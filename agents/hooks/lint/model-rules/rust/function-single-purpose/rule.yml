# M-30 single-purpose functions (agents/AGENTS.md: "keep functions single-purpose at one abstraction level").
# Advisory: the Stop hook reports findings and never promotes this rule to a gate (ADR-0021). Every function changed
# in the session is a subject: a matcher over-matches on purpose, because a missed function fails silently and an
# irrelevant one is cheap to read; the criteria exclude orchestration that only calls named steps.
id: function-single-purpose
language: Rust
kind: noul
subject: node
state: local
# Fitted by `jev-lint eval` on this rule's own fixtures (9 cases, 4 bad and 5 clean, over 3 passes; baseline of
# 2026-11-18): the highest clean case scored 0.25 (conforming.rs:33) and the lowest violation 0.71 (violating.rs:5); the
# cutoff is jev-lint's fitted midpoint of that gap. A fit on so few cases is a starting point, not a calibration
# (ADR-0020), so the rule stays advisory.
threshold: 0.48
axis: file
severity: warning
rule:
  any:
    - kind: function_item
    # A closure with a block body bound to a name: `let work = || { .. };`
    - all:
        - kind: closure_expression
        - inside: { kind: let_declaration }
        - has: { field: body, kind: block }
ask: >-
  This function does more than one job, or mixes high-level steps with low-level details in one body.
criteria:
  "true": >-
    A reader cannot state what the function does in one sentence without "and", or its body alternates between
    orchestrating named steps and doing the low-level work of those steps inline (parsing bytes, formatting strings,
    indexing, driving a protocol) so that two levels of abstraction share one body.
  "false": >-
    The body does one job, or only sequences calls to named steps at one level. A long body of one level, a function
    whose several statements all serve one result, and a thin wrapper are not violations.
