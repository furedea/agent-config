id: go_library_no_global_logger
language: go
severity: warning
message: "A library package must not configure the global logger; accept a `*slog.Logger` instead."
note: "`package main` is skipped, because the program owns the global logger."
rule:
  kind: call_expression
  regex: ^(slog\.SetDefault|log\.(SetOutput|SetFlags|SetPrefix))\(
  not:
    inside:
      kind: source_file
      has:
        kind: package_clause
        regex: ^package main$
      stopBy: end
