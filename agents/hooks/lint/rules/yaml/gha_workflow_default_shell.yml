id: gha_workflow_default_shell
language: yaml
severity: error
message: "Without an explicit shell, `run` steps use `bash -e` without pipefail, so a failing command in a pipe is reported as success."
note: "Add `defaults: { run: { shell: bash } }` at the top level of the workflow."
files:
  - "**/.github/workflows/**"
# Scope: Only workflows with a `run:` step are checked: a workflow of reusable-workflow calls has none, and a caller's `defaults` do not reach the called workflow. A `defaults.run.shell` at the workflow or at any job satisfies the rule; whether every job is covered is not judged.
rule:
  kind: block_mapping
  inside:
    kind: block_node
    inside:
      kind: document
  has:
    kind: block_mapping_pair
    has:
      field: key
      regex: ^jobs$
  all:
    - has:
        stopBy: end
        any:
          - kind: block_mapping_pair
            has:
              field: key
              regex: ^["']?run["']?$
            inside:
              kind: block_mapping
              inside:
                kind: block_node
                inside:
                  kind: block_sequence_item
          # A step written as a flow mapping inside a flow sequence: `steps: [{run: echo hi}]`.
          - kind: flow_pair
            has:
              field: key
              regex: ^["']?run["']?$
            inside:
              kind: flow_mapping
              inside:
                kind: flow_node
                inside:
                  kind: flow_sequence
    - not:
        has:
          stopBy: end
          kind: block_mapping_pair
          all:
            - has:
                field: key
                regex: ^defaults$
            - has:
                field: value
                has:
                  stopBy: end
                  kind: block_mapping_pair
                  all:
                    - has:
                        field: key
                        regex: ^shell$
                    - has:
                        field: value
                        regex: ^["']?bash["']?$|pipefail
