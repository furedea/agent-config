# agents/skills/python-style/references/testing.md: a fixture is for setup shared across two or more tests, external
# resources, or teardown via yield; otherwise a helper function, and a wider scope only for expensive setup. The
# whole file is sent so the model can count the tests that use the fixture. Advisory and unfitted (ADR-0021).
id: fixture-justified
language: Python
kind: noul
subject: node
state: located
threshold: 0.5
axis: file
severity: warning
rule:
  all:
    - kind: decorated_definition
    - has:
        kind: decorator
        regex: ^@(pytest\.)?(\w+_)?fixture\b
ask: >-
  This fixture is not justified by shared setup, an external resource, or teardown, or its scope is wider than its setup
  cost needs.
criteria:
  "true": >-
    The file defines the tests, only one of them uses the fixture, and it has no teardown after `yield` and no external resource; or the setup is
    lightweight, or the tests need to pass arguments to it, so a helper function would do; or its scope is `module` or
    `session` although the setup is cheap; none of this applies to a fixture defined in `conftest.py`.
  "false": >-
    Two or more tests use the fixture, or the fixture is defined in `conftest.py` (its users are in other files that
    are not shown), or it manages an external resource or
    teardown, or it needs a wider scope because its setup is expensive.
