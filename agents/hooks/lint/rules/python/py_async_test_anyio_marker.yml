id: py_async_test_anyio_marker
language: python
severity: warning
message: "Mark the async test with `@pytest.mark.anyio` (or a module-level `pytestmark`) so anyio runs it."
note: "A test that requests the `anyio_backend` fixture is run by anyio without a marker. A marker on an enclosing class or a module-level `pytestmark = pytest.mark.anyio` also counts."
rule:
  kind: function_definition
  regex: ^async\s+def\s+test_
  not:
    any:
      - has:
          field: parameters
          kind: parameters
          has:
            any:
              - kind: identifier
              - kind: typed_parameter
              - kind: default_parameter
              - kind: typed_default_parameter
            regex: ^anyio_backend(\s*[:=]|$)
      - inside:
          kind: decorated_definition
          stopBy: end
          has:
            kind: decorator
            regex: pytest\.mark\.anyio
      - inside:
          kind: module
          stopBy: end
          has:
            kind: expression_statement
            has:
              kind: assignment
              all:
                - has:
                    field: left
                    kind: identifier
                    regex: ^pytestmark$
                - has:
                    field: right
                    any:
                      - kind: attribute
                        regex: ^pytest\.mark\.anyio$
                      - has:
                          stopBy: end
                          kind: attribute
                          regex: ^pytest\.mark\.anyio$
