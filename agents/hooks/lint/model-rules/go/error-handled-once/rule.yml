# Go errors (agents/skills/go-style/references/errors.md: "Do not log and return the same error; handle it at one
# level, usually the outermost"). Advisory (ADR-0021). The cutoff 0.41 is jev-lint's fitted midpoint on this folder's
# fixtures (eval of 2026-11-19, 3 passes): the highest clean case scored 0.06 and the lowest bad one 0.75 (a retry
# loop that logs each attempt's error at debug level and returns the last one wrapped, which the model scores lower
# than a plain log-and-return).
id: error-handled-once
language: Go
kind: noul
subject: node
state: local
threshold: 0.41
# The fixtures sit far from the cutoff on both sides, so replay calls the suite blind; a boundary fixture would
# need a case a reviewer would argue over.
inconclusive: >-
  Blind: every fixture is clearly clean or clearly defective and no boundary case exists yet; the next one to
  add is a function that logs an error and returns a new error that does not wrap it.
axis: file
severity: warning
# Only functions (including function literals) that log are asked about; a function that never logs cannot log and
# return the same error. A logger is any receiver, including one reached through `Default()`, whose call has an argument
# (so `err.Error()` is not one) or starts an event chain (zerolog's `log.Error().Err(err).Msg(...)`); error constructors
# and test reporters are not loggers. A log call inside a nested function literal selects only that literal, the
# function nearest to the call.
# Limits: the logger matcher is broad on purpose and the criteria decide. It also selects calls shaped like a log that
# are not one (`http.Error(w, msg, code)`, `cmd.Output()`, a framework `c.Error(err)`, `s.t.Fatal(...)`), and it
# misses a log inside a closure the function runs itself (`defer func() { log.Error(err) }()`): only the literal is
# asked about there.
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: method_declaration
        - kind: func_literal
    - has:
        kind: call_expression
        stopBy:
          kind: func_literal
        regex: ^(\w+(\(\))?\.)+((Debug|Info|Warn|Warning|Error|Log)(f|w|ln|Context|Attrs)?\(\s*[^)\s]|(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Output)\(|(Trace|Debug|Info|Warn|Error|Fatal|Panic)\(\)\.)
        not:
          regex: ^(fmt|errors|xerrors|status|t|b|tb|require|assert)\.
ask: >-
  This function logs an error and also returns that same error, or a wrapped form of it, to its caller.
criteria:
  "true": >-
    On some path the function writes an error to a log and then returns that error (or an error wrapping it), so the
    caller will handle or log it again.
  "false": >-
    Every error is either logged and swallowed, or returned without being logged. A log of a value that is not the
    returned error, or of an error that is then recovered from, is not a violation.
