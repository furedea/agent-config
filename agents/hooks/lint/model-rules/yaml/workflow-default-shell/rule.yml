# github-actions-style: `defaults.run.shell: bash` so that `run:` steps get `pipefail`. Advisory; it was a blocking
# ast-grep rule (gha_workflow_default_shell) until review showed that job-level defaults, matrix keys and custom shell
# strings cannot be told apart by syntax alone (ADR-0021).
id: workflow-default-shell
language: Yaml
kind: noul
subject: node
state: located
threshold: 0.5
axis: file
severity: warning
# A step's `run:`, wherever the workflow sets (or fails to set) the shell for it.
rule:
  all:
    - kind: block_mapping_pair
    - has: { field: key, regex: "^[\"']?run[\"']?$" }
    # Only a GitHub Actions file: a rule cannot be scoped by path, so the document must carry a `runs-on` (a workflow job)
    # or `using` (a composite action) key. A CircleCI or GitLab file with `run:` steps has neither.
    - inside:
        kind: document
        stopBy: end
        has:
          stopBy: end
          kind: block_mapping_pair
          has: { field: key, regex: "^[\"']?(runs-on|using)[\"']?$" }
    # A key of a step mapping itself, not of a nested `with:` or `env:` mapping.
    - inside:
        kind: block_mapping
        stopBy: neighbor
        inside: { kind: block_node, stopBy: neighbor, inside: { kind: block_sequence_item, stopBy: neighbor } }
ask: >-
  The shell that this `run:` step executes under does not enable `pipefail`.
criteria:
  "true": >-
    Find the step's effective shell: its own `shell:`, else the job's `defaults.run.shell`, else the workflow's, else
    GitHub's default for a Linux or macOS runner, `bash -e {0}`, which has no `pipefail`. True when that shell is not
    one with `pipefail`: nothing is set, `sh`, `bash -e {0}`, or a custom command that does not pass `-o pipefail`
    (or `-eo pipefail`) to bash. A custom shell that only mentions the word `pipefail`, for example in an environment
    variable name, does not enable it. A composite action step's `shell: sh` is true too.
  "false": >-
    The effective shell is `bash` (which GitHub runs as `bash --noprofile --norc -eo pipefail {0}`) or a custom command
    that runs bash with `-o pipefail`, or the runner is Windows and the step runs under PowerShell (`pwsh` or
    `powershell`).
