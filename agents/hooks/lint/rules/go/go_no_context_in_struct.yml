id: go_no_context_in_struct
# Limits: Only a file that imports the standard `context` package without an alias is judged.
language: go
severity: error
message: "A context stored in a struct outlives the call it belongs to, so cancellation and deadlines go stale."
note: "Pass it as the first parameter: `func (s *Server) Run(ctx context.Context)` instead of a `ctx context.Context` field."
rule:
  kind: field_declaration
  has:
    field: type
    kind: qualified_type
    regex: ^context\.Context$
  all:
    - inside:
          kind: source_file
          has:
            kind: import_spec
            not:
              has:
                field: name
                regex: .+
            has:
              field: path
              regex: ^"context"$
            stopBy: end
          stopBy: end
