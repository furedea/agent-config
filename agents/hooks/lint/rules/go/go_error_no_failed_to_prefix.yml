id: go_error_no_failed_to_prefix
language: go
severity: error
message: "An error that starts with \"failed to\" repeats the failure that every error already states and reads badly once wrapped."
note: "Start with the operation: `fmt.Errorf(\"failed to read config: %w\", err)` -> `fmt.Errorf(\"read config: %w\", err)`."
rule:
  any:
    - pattern: fmt.Errorf($MSG, $$$ARGS)
    - pattern:
        context: "func f() { fmt.Errorf($MSG) }"
        selector: call_expression
    - pattern:
        context: "func f() { errors.New($MSG) }"
        selector: call_expression
constraints:
  MSG:
    regex: ^["`][Ff]ailed to\b
