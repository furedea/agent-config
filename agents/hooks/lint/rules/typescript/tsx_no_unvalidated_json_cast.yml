id: tsx_no_unvalidated_json_cast
language: tsx
severity: error
message: "Asserting the type of `JSON.parse` or `response.json()` output skips validation, so malformed external data enters typed code unchecked."
note: "Parse as `unknown` and validate it: `const config = parseConfig(JSON.parse(text))` instead of `JSON.parse(text) as Config`."
rule:
  any:
    - pattern: JSON.parse($$$ARGS) as $TYPE
    - pattern: (await $RECEIVER.json()) as $TYPE
    - pattern: JSON.parse($$$ARGS) as unknown as $TYPE
    - pattern: JSON.parse($$$ARGS)! as $TYPE
    - pattern: (await $RESPONSE.json())! as $TYPE
    - pattern: JSON.parse($$$ARGS) satisfies $TYPE
    - pattern: (await $RECEIVER.json()) satisfies $TYPE
    - pattern: await $RECEIVER.json() satisfies $TYPE
    - pattern: await $RECEIVER.json() as $TYPE
    - pattern: await $RECEIVER.json() as unknown as $TYPE
    - pattern: (await $RECEIVER.json()) as unknown as $TYPE
    - pattern: $RECEIVER.json() as $TYPE
    - all:
        - any:
            - kind: variable_declarator
            - kind: public_field_definition
            - kind: required_parameter
        - has:
            field: type
            kind: type_annotation
            not: { regex: ':\s*(Promise<unknown>|unknown)$' }
        - has:
            field: value
            any:
              - pattern: JSON.parse($$$ARGS)
              - pattern: await $RESPONSE.json()
              - pattern: $RESPONSE.json()
    - all:
        - kind: arrow_function
        - has:
            field: return_type
            kind: type_annotation
            not: { regex: ':\s*(Promise<unknown>|unknown)$' }
        - has:
            field: body
            any:
              - pattern: JSON.parse($$$ARGS)
              - pattern: await $RESPONSE.json()
              - pattern: $RESPONSE.json()
    - all:
        - kind: return_statement
        - has:
            any:
              - pattern: JSON.parse($$$ARGS)
              - pattern: await $RESPONSE.json()
              - pattern: $RESPONSE.json()
        - inside:
            any:
              - kind: function_declaration
              - kind: function_expression
              - kind: arrow_function
              - kind: method_definition
            has:
              field: return_type
              kind: type_annotation
              not: { regex: ':\s*(Promise<unknown>|unknown)$' }
            stopBy:
              any:
                - kind: function_declaration
                - kind: function_expression
                - kind: arrow_function
                - kind: method_definition
constraints:
  RESPONSE: { regex: '(?i)res(ponse)?$' }
  TYPE:
    not:
      regex: ^(Promise<unknown>|unknown)$
