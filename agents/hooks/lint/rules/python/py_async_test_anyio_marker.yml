id: py_async_test_anyio_marker
language: python
severity: error
message: "Without the anyio marker pytest never runs this async test, so it silently passes."
note: "Add `@pytest.mark.anyio` above `async def test_...` (or `pytestmark = pytest.mark.anyio` at module level, or request the `anyio_backend` fixture)."
utils:
  anyio_pytestmark:
    kind: assignment
    all:
      - has:
          field: left
          kind: identifier
          regex: ^pytestmark$
      - has:
          field: right
          any:
            - regex: (?s)^(pytest\.)?mark\.usefixtures\(.*["']anyio_backend["']
            - has:
                stopBy: end
                kind: call
                regex: (?s)^(pytest\.)?mark\.usefixtures\(.*["']anyio_backend["']
            - kind: attribute
              regex: ^(pytest\.)?mark\.anyio$
            - has:
                stopBy: end
                kind: attribute
                regex: ^(pytest\.)?mark\.anyio$
rule:
  kind: function_definition
  regex: ^async\s+def\s+test_
  not:
    any:
      - has:
          field: parameters
          kind: parameters
          has:
            any:
              - kind: identifier
              - kind: typed_parameter
              - kind: default_parameter
              - kind: typed_default_parameter
            regex: ^anyio_backend(\s*[:=]|$)
      - inside:
          kind: decorated_definition
          stopBy: end
          has:
            kind: decorator
            regex: ^@pytest\.mark\.anyio(\(\))?$
      - inside:
          kind: decorated_definition
          stopBy: end
          has:
            kind: decorator
            regex: (?s)^@pytest\.mark\.usefixtures\(.*["']anyio_backend["']
      - all:
          - inside:
              kind: decorated_definition
              stopBy: end
              has:
                kind: decorator
                regex: (?s)^@mark\.usefixtures\(.*["']anyio_backend["']
          - inside:
              kind: module
              stopBy: end
              has:
                kind: import_from_statement
                regex: (?s)^from\s+pytest\s+import\b.*\bmark\b
      - all:
          - inside:
              kind: decorated_definition
              stopBy: end
              has:
                kind: decorator
                regex: ^@mark\.anyio(\(\))?$
          - inside:
              kind: module
              stopBy: end
              has:
                kind: import_from_statement
                regex: (?s)^from\s+pytest\s+import\b.*\bmark\b
      - all:
          - inside:
              kind: module
              stopBy: end
              has:
                pattern: import pytest as $ALIAS
          - inside:
              kind: decorated_definition
              stopBy: end
              has:
                kind: decorator
                has:
                  pattern: $ALIAS.mark.anyio
      - all:
          - inside:
              kind: module
              stopBy: end
              has:
                pattern: import pytest as $ALIAS
          - inside:
              kind: module
              stopBy: end
              has:
                kind: expression_statement
                regex: ^pytestmark\s*=\s*\w+\.mark\.anyio$
      - inside:
          any:
            - kind: module
            - kind: class_definition
          stopBy: end
          has:
            kind: expression_statement
            has:
              matches: anyio_pytestmark
      - inside:
          kind: class_definition
          stopBy: end
          has:
            kind: block
            has:
              kind: expression_statement
              has:
                matches: anyio_pytestmark
