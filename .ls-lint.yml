ls:
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*
  .md: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:(README|CONTRIBUTING|DESIGN|CHANGELOG|AGENTS|CLAUDE|SKILL) | regex:(README|DESIGN)(_ja)?
  .json: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:\.?release-please-(config|manifest)
  .py: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:__[a-z0-9]+__
  .*: regex:[a-z0-9]*([._][a-z0-9]+)*
  .github:
    workflows:
      .yml: regex:[a-z0-9]+(-[a-z0-9]+)*

ignore:
  - .git
  - .direnv
  - result
  - result-*
  - docs/logs
  - package-lock.json
  - "**/package-lock.json"
  - "**/docs/logs"

  - "{.venv,.coverage,.uv-cache,.ruff_cache,.pytest_cache,.hypothesis,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - "**/{.venv,.coverage,.uv-cache,.ruff_cache,.pytest_cache,.hypothesis,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - "{dist,build}"
  - "**/{dist,build}"
