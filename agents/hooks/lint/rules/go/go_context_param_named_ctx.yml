id: go_context_param_named_ctx
language: go
severity: warning
message: "Name a `context.Context` parameter `ctx`."
note: "The position of the parameter is judged by revive `context-as-argument`."
rule:
  kind: identifier
  not:
    regex: ^(ctx|_)$
  inside:
    kind: parameter_declaration
    has:
      field: type
      kind: qualified_type
      regex: ^context\.Context$
