default: clean
# Lines are the first line of each function. violating.go: the function logs an error and returns that error or a
# wrapper of it. conforming.go: an error logged and swallowed, a log of something that is not the returned error, an
# error logged and replaced by a fallback value, and a retry loop that is a violation although it looks like one that
# recovers: its last attempt's error is logged and then returned wrapped.
fixtures/violating.go:
  - { line: 9, label: bad, window: 1, why: "logs the read error, then returns it" }
  - { line: 18, label: bad, window: 1, why: "logs the write error, then returns it wrapped" }
  - { line: 30, label: bad, window: 1, why: "logs through a logger field, then returns the same error" }
fixtures/conforming.go:
  - { line: 9, label: clean, window: 1 }
  - { line: 17, label: clean, window: 1 }
  - { line: 26, label: clean, window: 1, why: "boundary: the logged error is recovered from with a fallback, not returned" }
  - { line: 35, label: bad, window: 1, why: "boundary: the last attempt's error is logged at debug and then returned wrapped" }
