name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every tool a job runs comes from the flake dev shell, so CI and a local shell use the versions in flake.lock.
defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

env:
  # Fail when uv.lock disagrees with pyproject.toml instead of rewriting it.
  UV_LOCKED: "1"

jobs:
  nix-lint:
    uses: furedea/reusable-workflows/.github/workflows/nix-lint.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0
        with:
          save: false

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format
        run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0
        with:
          save: false

      - name: Run ty
        run: uv run ty check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0
        with:
          save: false

      - name: Install locked JavaScript tools
        run: |
          npm ci --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install locked agent-harness
        uses: ./.github/actions/install-agent-harness # zizmor: ignore[self-repository]

      # The provider integration tests render with the locked agent-harness CLI.
      - name: Run pytest
        env:
          CODEX_BIN: codex
          REQUIRE_CODEX_EXECPOLICY: "1"
        run: uv run pytest --cov

  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # One job saves the shared devShell closure (nix-setup saves on push by default); the others only restore it.
      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0

      - name: Run bats
        run: bats --print-output-on-failure tests/bootstrap_server.bats

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0
        with:
          save: false

      - name: Install locked agent-harness
        uses: ./.github/actions/install-agent-harness # zizmor: ignore[self-repository]

      # verify checks the source-declared runtime commands, which the devShell provides.
      - name: Render and verify the agent source
        run: |
          prefix="$RUNNER_TEMP/agent-prefix"
          agent-harness install --source agents --prefix "$prefix"
          agent-harness verify --source agents --prefix "$prefix"

  execpolicy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0
        with:
          save: false

      - name: Install locked JavaScript tools
        run: |
          npm ci --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install locked agent-harness
        uses: ./.github/actions/install-agent-harness # zizmor: ignore[self-repository]

      - name: Run Codex execpolicy conformance
        env:
          CODEX_BIN: codex
          REQUIRE_CODEX_EXECPOLICY: "1"
        run: bats --print-output-on-failure tests/codex/execpolicy.bats

  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The script under test installs its own tools, so it must not run inside the devShell.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # An empty home exercises every download the script pins, as on a fresh server.
      - name: Run the server bootstrap in an empty home
        run: |
          home="$RUNNER_TEMP/bootstrap-home"
          mkdir -p "$home"
          HOME="$home" scripts/bootstrap_server.sh

      - name: Verify the bootstrapped harness
        run: |
          home="$RUNNER_TEMP/bootstrap-home"
          HOME="$home" PATH="$home/.local/bin:$PATH" agent-harness verify --source agents --prefix "$home"

  shell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0
        with:
          save: false

      - name: Run shellcheck and shfmt
        run: |
          mapfile -d '' -t files < <(git ls-files -z -- '*.sh')
          shellcheck -x --source-path=SCRIPTDIR "${files[@]}"
          shfmt -d "${files[@]}"

  nix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # `nix build` needs no dev shell.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0
        with:
          save: false

      - name: Build the agent source
        run: nix build .#default

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0
        with:
          save: false

      - name: Run deptry
        run: uv run --group audit deptry .

      - name: Run vulture
        run: uv run --group audit vulture

  gha-lint:
    uses: furedea/reusable-workflows/.github/workflows/gha-lint.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      actions: read
      contents: read

  dependency-review:
    uses: furedea/reusable-workflows/.github/workflows/dependency-review.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read

  nix-check:
    uses: furedea/reusable-workflows/.github/workflows/nix-check.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read

  claude-review:
    uses: furedea/reusable-workflows/.github/workflows/claude-review.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read
      pull-requests: write
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  codex-review:
    uses: furedea/reusable-workflows/.github/workflows/codex-review.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions: {}
    secrets:
      codex_review_token: ${{ secrets.CODEX_REVIEW_TOKEN }}

  all-green:
    if: always()
    needs:
      - nix-lint
      - lint
      - typecheck
      - test
      - bats
      - bootstrap
      - render
      - execpolicy
      - shell-lint
      - nix-build
      - audit
      - gha-lint
      - dependency-review
      - nix-check
      - claude-review
      - codex-review
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    # The default shell needs Nix, which this job does not install.
    defaults:
      run:
        shell: bash
    steps:
      - name: Fail if any prerequisite did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
