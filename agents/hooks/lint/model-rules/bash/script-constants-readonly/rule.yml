# bash-style: "Declare constants with `readonly`" (the name's case is checked by the ast-grep rule
# bash_readonly_constant_name).
# Advisory; the prose stays until the rule is promoted (ADR-0021). The cutoff 0.5 is jev-lint's fitted midpoint: on
# this folder's fixtures (3 bad, 4 clean, 3 passes) the highest clean case scored 0.04 and the lowest bad one 0.96.
# Seven cases are not a calibration, so the rule stays advisory.
id: script-constants-readonly
language: Bash
kind: noul
subject: node
# The whole file: whether a top-level value is ever reassigned, or declared `readonly` on the next line, is decided by
# the statements after it, which `local` (the assignment alone) did not show, so every clean case answered true.
state: located
threshold: 0.5
inconclusive: >-
  Blind: every fixture sits 0.46 or more from the cutoff; a boundary case needs a value a reader would argue over (one
  that only a sourced file reassigns), and none is written yet.
axis: file
severity: warning
# A top-level assignment: the script's own configuration and paths, which are constants unless the script changes them.
rule:
  all:
    - kind: variable_assignment
    - inside: { kind: program, stopBy: neighbor }
ask: >-
  The variable assigned by this top-level statement is a constant that the script never changes, yet no `readonly`
  declares it.
criteria:
  "true": >-
    Search the whole file for the variable's name. It is true only when no later statement assigns it again (`NAME=`,
    `NAME+=`, `((NAME++))`, `read NAME`, a `for NAME in` loop, `getopts ... NAME`), none unsets it, and no `readonly
    NAME`, `readonly NAME=...` or `declare -r NAME` declares it.
  "false": >-
    Some other statement in the file declares the name `readonly` (the two-step `NAME=$(cmd)` followed by `readonly
    NAME` is the usual way to make a command's output constant), or some statement changes it later: a counter or
    accumulator that a loop or an `if` updates, an array that `+=` extends, a flag that a `case` branch or `getopts`
    sets. Such a variable is not a constant, whatever its initial value looks like.
