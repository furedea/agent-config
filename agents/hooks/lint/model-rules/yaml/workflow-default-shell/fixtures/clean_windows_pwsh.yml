name: Windows
on: pull_request
permissions: {}
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: Get-ChildItem -Recurse -Filter *.Tests.ps1 | Invoke-Pester
