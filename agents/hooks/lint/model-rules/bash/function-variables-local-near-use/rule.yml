# bash-style: "Declare function-local variables with `local`" and "Define variables just before first use". Advisory;
# the prose stays until the rule is promoted (ADR-0021). The cutoff is the 0.5 starting value and is not fitted.
id: function-variables-local-near-use
language: Bash
kind: noul
subject: node
# The whole file: the comment above the function and the callers that read a variable it sets for them decide whether
# that variable is a deliberate global, and `local` (the function alone) misread a documented output variable.
state: located
threshold: 0.5
axis: file
severity: warning
rule:
  all:
    - kind: function_definition
    - has:
        any:
          - kind: variable_assignment
          - kind: for_statement
          # Builtins that assign without an assignment node.
          - kind: command
            regex: "^(read|mapfile|readarray|getopts|let|printf\\s+-v)\\b"
          # An arithmetic command, `((count++))`.
          - kind: compound_statement
            regex: "^\\(\\("
        stopBy: end
ask: >-
  A variable that this function assigns is not declared with `local`, or is declared and assigned far above the place
  where it is first used.
criteria:
  "true": >-
    The function assigns a variable that is meant for its own use without declaring it `local`, so it leaks into the
    caller's scope. Check every name the function assigns, not only `NAME=value`: the variable of a `for` loop, the
    target of `read`, `mapfile`, `readarray` or `printf -v`, and a counter in `(( ))` each need their own `local`, even
    when the function declares other variables `local`. Also true when the function declares and assigns a variable
    many lines before the first statement that reads it, with unrelated statements in between.
  "false": >-
    Every name the function assigns for its own use, loop variables and `read` targets included, is declared `local`
    and sits just before its first use. A variable that the function deliberately sets for its caller or for the script
    is not a violation when a comment above or inside the function says so or the rest of the file reads it after the
    call. An environment variable assigned only for one command (`VAR=value cmd`) is not a violation.
