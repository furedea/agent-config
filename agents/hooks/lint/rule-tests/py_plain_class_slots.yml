    class Registry:
        def __init__(self) -> None:
            self.cache["key"] = 1
  - |
    from functools import cached_property as cached


    @typing.final
    class Report:
        def __init__(self, rows: list[int]) -> None:
            self.rows = rows

        @cached
        def total(self) -> int:
            return sum(self.rows)
