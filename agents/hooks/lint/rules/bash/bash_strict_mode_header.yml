id: bash_strict_mode_header
language: bash
severity: warning
message: "Put `set -euCo pipefail` at the top level, before any command that runs."
note: "Only files with a `sh` or `bash` shebang are checked: a sourced library has none, and a `bats` file keeps its own. Comments and function definitions may come first, since defining a function runs nothing."
rule:
  kind: program
  has:
    kind: comment
    regex: ^#!.*\b(ba)?sh\b
  not:
    has:
      kind: command
      regex: ^set\s+-euCo\s+pipefail$
      not:
        follows:
          stopBy: end
          not:
            any:
              - kind: comment
              - kind: function_definition
