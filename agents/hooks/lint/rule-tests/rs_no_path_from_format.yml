id: rs_no_path_from_format
valid:
  - |
    fn f(dir: &Path) -> PathBuf { dir.join("a") }
  - |
    fn f(name: &str) -> PathBuf { PathBuf::from(name) }
  - |
    fn f(name: &str) -> String { format!("{name}.txt") }
invalid:
  - |
    fn f(dir: &str) -> PathBuf { PathBuf::from(format!("{dir}/a")) }
  - |
    fn f(dir: &str) { let p = Path::new(&format!("{}/a", dir)); }
  - |
    fn f(dir: String) { let p = Path::new(&(dir + "/a")); }
  - |
    fn f(root: &str) -> PathBuf { std::path::PathBuf::from(format!("{root}/child")) }
  - |
    fn f(root: String) -> PathBuf { PathBuf::from(root + "/child") }
