id: py_frozen_base_model_no_override
language: python
severity: error
message: "Changing a locked setting in a subclass makes it mutable or lenient, which breaks the `FrozenBaseModel` guarantee."
note: "Remove `frozen`, `extra`, `strict`, `validate_default` and `revalidate_instances` from this class's `model_config` or keywords; keep other keys such as `alias_generator`."
utils:
  bad_keyword:
    kind: keyword_argument
    any:
      - all:
          - regex: ^frozen\s*=
          - not:
              regex: ^frozen\s*=\s*True$
      - all:
          - regex: ^extra\s*=
          - not:
              regex: ^extra\s*=\s*["']forbid["']$
      - all:
          - regex: ^strict\s*=
          - not:
              regex: ^strict\s*=\s*True$
      - all:
          - regex: ^validate_default\s*=
          - not:
              regex: ^validate_default\s*=\s*True$
      - all:
          - regex: ^revalidate_instances\s*=
          - not:
              regex: ^revalidate_instances\s*=\s*["']always["']$
  bad_pair:
    kind: pair
    any:
      - all:
          - regex: '^["'']frozen["'']\s*:'
          - not:
              regex: '^["'']frozen["'']\s*:\s*True$'
      - all:
          - regex: '^["'']extra["'']\s*:'
          - not:
              regex: '^["'']extra["'']\s*:\s*["'']forbid["'']$'
      - all:
          - regex: '^["'']strict["'']\s*:'
          - not:
              regex: '^["'']strict["'']\s*:\s*True$'
      - all:
          - regex: '^["'']validate_default["'']\s*:'
          - not:
              regex: '^["'']validate_default["'']\s*:\s*True$'
      - all:
          - regex: '^["'']revalidate_instances["'']\s*:'
          - not:
              regex: '^["'']revalidate_instances["'']\s*:\s*["'']always["'']$'
  config_override:
    kind: assignment
    all:
      - has:
          field: left
          kind: identifier
          regex: ^model_config$
      - has:
          field: right
          any:
            - kind: call
              has:
                kind: argument_list
                has:
                  matches: bad_keyword
            - kind: dictionary
              has:
                matches: bad_pair
            - kind: binary_operator
              has:
                stopBy: end
                any:
                  - matches: bad_keyword
                  - matches: bad_pair
rule:
  kind: class_definition
  all:
    - has:
        field: superclasses
        kind: argument_list
        has:
          any:
            - kind: identifier
              regex: ^FrozenBaseModel$
            - kind: attribute
              regex: \.FrozenBaseModel$
    - any:
        - has:
            field: superclasses
            kind: argument_list
            has:
              matches: bad_keyword
        - has:
            field: body
            kind: block
            has:
              kind: expression_statement
              has:
                matches: config_override
