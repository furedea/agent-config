id: gha_workflow_concurrency
language: yaml
severity: warning
message: "Add a top-level `concurrency` with `group` and `cancel-in-progress` so stale runs on the same ref are cancelled."
note: "Only workflows triggered by `push` or `pull_request` are checked. The value of `cancel-in-progress` is not judged, because a deploy workflow that must run in order sets it to false, and a workflow that is only called or dispatched has no burst of runs per ref."
files:
  - "**/.github/workflows/**"
rule:
  kind: block_mapping
  inside:
    kind: block_node
    inside:
      kind: document
  has:
    kind: block_mapping_pair
    all:
      - has:
          field: key
          regex: ^"?on"?$
      - has:
          field: value
          regex: \b(push|pull_request)\b
  not:
    has:
      kind: block_mapping_pair
      all:
        - has:
            field: key
            regex: ^concurrency$
        - has:
            field: value
            has:
              stopBy: end
              kind: block_mapping_pair
              has:
                field: key
                regex: ^cancel-in-progress$
