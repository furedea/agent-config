name: Install locked agent-harness
description: Install the agent-harness revision locked in flake.lock and add it to PATH.

runs:
  using: composite
  steps:
    - name: Resolve locked agent-harness revision
      id: agent_harness
      shell: bash
      run: |
        agent_harness_rev="$(
          jq -er '.nodes["agent-harness"].locked.rev | select(test("^[0-9a-f]{40}$"))' flake.lock
        )"
        echo "revision=$agent_harness_rev" >> "$GITHUB_OUTPUT"

    - name: Cache agent-harness
      id: agent_harness_cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/agent-harness/bin/agent-harness
        key: agent-harness-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.agent_harness.outputs.revision }}

    - name: Install Rust toolchain
      if: steps.agent_harness_cache.outputs.cache-hit != 'true'
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: 1.98.1
        rustflags: ""

    - name: Install locked agent-harness
      if: steps.agent_harness_cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        AGENT_HARNESS_REV: ${{ steps.agent_harness.outputs.revision }}
      run: |
        cargo install \
          --git https://github.com/furedea/agent-harness \
          --rev "$AGENT_HARNESS_REV" \
          --locked \
          --root "$RUNNER_TEMP/agent-harness" \
          agent-harness

    # The entry is a fixed runner directory holding only the binary built from the locked revision.
    - name: Add agent-harness to PATH
      shell: bash
      run: echo "$RUNNER_TEMP/agent-harness/bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
