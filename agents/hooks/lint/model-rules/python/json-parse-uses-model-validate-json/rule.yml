# agents/skills/python-style/references/models.md: parse JSON with `Model.model_validate_json(...)`; a strict model
# rejects a dict built by `json.loads` for datetime, UUID and similar fields. Every `model_validate(...)` call is sent so
# the model can follow where the argument came from. Advisory (ADR-0021).
id: json-parse-uses-model-validate-json
language: Python
kind: noul
subject: node
state: located
# Cutoff 0.62: jev-lint's fitted midpoint on this folder's fixtures (3 violations, 5 conforming cases, 3 passes,
# means), where the loudest conforming case scored 0.25 and the quietest violation 0.94 (baseline.json, 2026-11-18).
threshold: 0.62
inconclusive: >-
  Blind: the conforming cases score at most 0.25 and the violations at least 0.94, both a quarter of the scale or more
  from the cutoff, so this corpus cannot see the rule drift. The hard conforming cases written for it still answered
  far below the cutoff; a boundary case needs real code that reviewers argue over, and none has been found yet.
axis: file
severity: warning
# Matched on the callee, so a call that only wraps `model_validate(...)` is not a subject of its own (#196).
rule:
  kind: call
  has:
    field: function
    kind: attribute
    has: { field: attribute, regex: ^model_validate$ }
ask: >-
  This `model_validate(...)` call validates a value that came from a JSON loader instead of using
  `model_validate_json`.
criteria:
  "true": >-
    The argument is the result of `json.loads`, `orjson.loads` or `ujson.loads` (directly, or through a variable that
    holds it unchanged) with no conversion option, so `Model.model_validate_json(raw)` would do the same job and keep
    strict mode working.
  "false": >-
    The loader call passes a conversion option (`object_hook`, `object_pairs_hook`, `parse_float`, `parse_int`,
    `parse_constant`, `cls`, `default`), which `model_validate_json` does not run. The argument is not parsed JSON (a dict built in code, a TOML or YAML result, a function argument), the loaded value
    is changed before validation, or the call needs options `model_validate_json` cannot take.
