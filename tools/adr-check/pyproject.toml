[project]
name = "adr-check"
version = "0.1.0"
description = "Check MADR ADRs against the front-matter shape of ADR-0025."
requires-python = ">= 3.13"
dependencies = [
  "jsonschema>=4.26",
  "ruamel.yaml>=0.19",
]

[project.scripts]
adr-check = "adrcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adrcheck"]
