id: go_iota_enum_typed
# Decision (#196): `iota + 1` stays skipped. `1 << (10 * iota)` and `iota + 1` are the standard untyped idioms for sizes and offsets, so telling them from an enum needs the intent, not the syntax.
# Limits: Only the plain form `X = iota` is judged. Any expression (`iota + Step`, a conversion, a builtin call, a shift, a list of values) is skipped, because a syntactic matcher cannot tell whether an operand is typed. A blank `_ = iota` is judged only when the next spec writes neither a type nor a value of its own. Whether the type has a `String()` method is not judged.
language: go
severity: error
message: "An untyped iota constant is a plain int, so the compiler cannot stop mixing it with other integers."
note: "Give the block a type: `StatePending = iota` -> `StatePending State = iota`."
rule:
  kind: const_spec
  has:
    field: value
    kind: expression_list
    regex: ^iota$
  not:
    any:
      - has:
          field: type
          regex: .+
      - all:
          - has:
              field: name
              regex: ^_$
          - precedes:
              stopBy:
                kind: const_spec
              all:
                - kind: const_spec
                - any:
                    - has:
                        field: type
                        regex: .+
                    - has:
                        field: value
                        regex: .+
