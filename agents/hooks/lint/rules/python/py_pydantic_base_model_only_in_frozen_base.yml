id: py_pydantic_base_model_only_in_frozen_base
language: python
severity: error
message: "A model that inherits pydantic's `BaseModel` directly skips the shared frozen, strict configuration."
note: "Change `class Money(BaseModel)` to `class Money(FrozenBaseModel)`; only `class FrozenBaseModel(pydantic.BaseModel)` may inherit `BaseModel`."
# Limits: `pydantic.v1` is found by its plain forms; a `BaseModel` renamed on import from `pydantic.v1` is not followed.
rule:
  kind: class_definition
  all:
    - not:
        has:
          field: name
          regex: ^FrozenBaseModel$
    - any:
        - has:
            field: superclasses
            kind: argument_list
            has:
              kind: attribute
              regex: ^pydantic(\.v1)?\.BaseModel$
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: import pydantic as $ALIAS
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $ALIAS.BaseModel
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  kind: import_from_statement
                  regex: '(?s)^from\s+pydantic(\.v1)?\s+import\b.*\bBaseModel\s*(,|\)|$)'
            - has:
                field: superclasses
                kind: argument_list
                has:
                  kind: identifier
                  regex: ^BaseModel$
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import BaseModel as $RENAMED
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import $$$BEFORE, BaseModel as $RENAMED
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import BaseModel as $RENAMED, $$$AFTER
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import $$$BEFORE, BaseModel as $RENAMED, $$$AFTER
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
