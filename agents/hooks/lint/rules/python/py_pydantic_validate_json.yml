id: py_pydantic_validate_json
language: python
severity: error
message: "Use `Model.model_validate_json(...)` instead of `Model.model_validate(json.loads(...))`; strict mode rejects JSON-natural conversions (for example ISO strings to datetime) otherwise."
note: "A loader call with extra arguments (`object_hook=`, `parse_float=`) is skipped, because `model_validate_json` cannot replace it. Also judges `import json as alias`, `from json import loads`, `orjson.loads` and `ujson.loads`. TOML and YAML loaders are not JSON and are not judged."
constraints:
  ARG:
    not:
      kind: keyword_argument
rule:
  any:
    - pattern: $MODEL.model_validate(json.loads($ARG))
    - pattern: $MODEL.model_validate(json.loads($ARG), $$$REST)
    - pattern: $MODEL.model_validate(orjson.loads($ARG))
    - pattern: $MODEL.model_validate(orjson.loads($ARG), $$$REST)
    - pattern: $MODEL.model_validate(ujson.loads($ARG))
    - pattern: $MODEL.model_validate(ujson.loads($ARG), $$$REST)
    - all:
        - any:
            - pattern: $MODEL.model_validate($ALIAS.loads($ARG))
            - pattern: $MODEL.model_validate($ALIAS.loads($ARG), $$$REST)
        - inside:
            kind: module
            stopBy: end
            has:
              pattern: import json as $ALIAS
    - all:
        - any:
            - pattern: $MODEL.model_validate($LOADER($ARG))
            - pattern: $MODEL.model_validate($LOADER($ARG), $$$REST)
        - inside:
            kind: module
            stopBy: end
            has:
              pattern: from json import loads as $LOADER
    - all:
        - any:
            - pattern: $MODEL.model_validate(loads($ARG))
            - pattern: $MODEL.model_validate(loads($ARG), $$$REST)
        - inside:
            kind: module
            stopBy: end
            has:
              kind: import_from_statement
              regex: (?s)^from\s+json\s+import\b.*\bloads\b
