# M-33 minimal comments (agents/AGENTS.md: "minimize comments and docstrings; use them for public APIs, TODOs,
# non-obvious constraints, and intent that code cannot express"). Advisory: the Stop hook reports findings and never
# promotes this rule to a gate (ADR-0021). Selected by a comment inside or just before the function that is not a tool
# directive or TODO; a comment that restates the next line is the violation.
id: no-comment-restating-code
language: Rust
kind: noul
subject: node
# A comment written just before the function lies outside its node, so the whole file is sent (#196).
state: located
# Fitted by `jev-lint eval` on this rule's own fixtures (12 cases, 6 bad and 6 clean, over 3 passes; baseline of
# 2026-11-19): the highest clean case scored 0.5 (conforming.rs:30) and the lowest violation 0.62 (violating.rs:44);
# the cutoff is jev-lint's fitted midpoint of that gap. Both are the cases added for #196: the doc comment of a public
# function and the plain comment before a function that restates its body, which scored 0.23 to 0.30 under `state:
# local`. A fit on so few cases is a starting point, not a calibration (ADR-0020), so the rule stays advisory.
threshold: 0.56
axis: file
severity: warning
rule:
  all:
    - kind: function_item
    - any:
        - has:
            kind: line_comment
            stopBy: end
            not: { regex: "^//\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" }
        - has:
            kind: block_comment
            stopBy: end
            not: { regex: "^/\\*\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" }
        # A comment written just before the function, with its attributes in between.
        - follows:
            any:
              - kind: line_comment
              - kind: block_comment
            not: { regex: "^(//|/\\*)\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" }
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
                  - kind: block_comment
ask: >-
  A comment in this function, or written just before it, restates what the code beside it already says.
criteria:
  "true": >-
    A comment only paraphrases the statement it precedes ("increment the counter", "loop over users"), narrates the
    control flow, or marks a section that a named function would make unnecessary, and it states no reason, constraint
    or intent. A plain comment (not a doc comment) written just before the function that only paraphrases its body
    counts too.
  "false": >-
    Every comment states a reason, a non-obvious constraint, a workaround, a link or an issue number, a TODO, or an
    intent the code cannot express; directives to tools (lint, type, license, build tags) and the doc comment of a
    public function, class or module API are not violations.
