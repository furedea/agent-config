id: ts_readonly_property
language: typescript
severity: warning
message: "Declare the property `readonly`."
note: "Declarations of `type` and `interface` only; the property types of parameters and function types are left alone."
rule:
  all:
    - kind: property_signature
    - not:
        regex: ^readonly\s
    - inside:
        any:
          - kind: interface_body
          - all:
              - kind: object_type
              - inside:
                  any:
                    - kind: type_alias_declaration
                    - kind: union_type
                    - kind: intersection_type
