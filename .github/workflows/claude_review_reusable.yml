name: Claude review (reusable)

on:
  workflow_call:
    secrets:
      claude_code_oauth_token:
        description: OAuth token for Claude Code (CLAUDE_CODE_OAUTH_TOKEN).
        required: true

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Secrets are not passed to forks, so skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review pull request
        id: review
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          allowed_bots: furedea-agent
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request read-only. Do not edit files.
            Look for correctness bugs, security problems, and missing tests for changed behavior.
            Skip style nits. Prefer no finding over a weak one.

            Tag every finding with a severity:
            - P0: certain breakage, data loss, or security hole
            - P1: likely bug or regression that should block the merge
            - P2: real but minor problem
            - P3: optional improvement

            Post each finding as an inline comment with
            mcp__github_inline_comment__create_inline_comment, starting the comment with its tag.
            Then post one top-level summary with `gh pr comment`.
            Finally return structured output where blocking_findings is the number of P0 and P1 findings.
          claude_args: |
            --model claude-opus-5-5
            --effort medium
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"blocking_findings":{"type":"integer","minimum":0}},"required":["blocking_findings"]}'

      - name: Fail on blocking findings
        id: gate
        env:
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: |
          blocking="$(jq -r '.blocking_findings' <<<"$STRUCTURED_OUTPUT" 2>/dev/null || true)"
          if [[ ! "$blocking" =~ ^[0-9]+$ ]]; then
            echo "reason=invalid-output" >>"$GITHUB_OUTPUT"
            echo "::error::Review returned no valid blocking_findings: ${STRUCTURED_OUTPUT:-<empty>}"
            exit 1
          fi
          echo "Blocking findings (P0 and P1): $blocking" >>"$GITHUB_STEP_SUMMARY"
          if ((blocking >= 1)); then
            message="$blocking blocking finding(s) (P0/P1). Read the inline review comments on the pull request."
            echo "$message" >>"$GITHUB_STEP_SUMMARY"
            echo "::error::$message"
            exit 1
          fi

      - name: Explain review failure
        if: failure()
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          TOKEN_PRESENT: ${{ secrets.claude_code_oauth_token != '' }}
        run: |
          {
            echo "### Claude review failed"
            if [[ "$GATE_REASON" == "invalid-output" ]]; then
              echo "- The review returned no valid blocking_findings (malformed structured output). Re-run the check; if it repeats, read the job log."
            elif [[ "$REVIEW_OUTCOME" == "success" ]]; then
              echo "- Blocking findings (P0/P1): read the inline review comments on the pull request."
            elif [[ "$TOKEN_PRESENT" != "true" ]]; then
              echo "- The OAuth token was not passed to this run (for example a Dependabot-triggered run). Check the secret is available to it."
            else
              echo "- The review step failed. If the log shows an authentication error, the token expired: run \`repo review-token rotate\`."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
