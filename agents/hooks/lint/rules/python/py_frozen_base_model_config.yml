id: py_frozen_base_model_config
language: python
severity: error
message: "A `FrozenBaseModel` without all five settings can be mutated or accept unvalidated input."
note: "Set `model_config = pydantic.ConfigDict(frozen=True, extra=\"forbid\", strict=True, validate_default=True, revalidate_instances=\"always\")`."
rule:
  kind: class_definition
  all:
    - has:
        field: name
        regex: ^FrozenBaseModel$
    - any:
        - has:
            field: superclasses
            kind: argument_list
            has:
              kind: attribute
              regex: ^pydantic\.BaseModel$
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: import pydantic as $ALIAS
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $ALIAS.BaseModel
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  kind: import_from_statement
                  regex: '(?s)^from\s+pydantic\s+import\b.*\bBaseModel\s*(,|\)|$)'
            - has:
                field: superclasses
                kind: argument_list
                has:
                  kind: identifier
                  regex: ^BaseModel$
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import BaseModel as $RENAMED
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import $$$BEFORE, BaseModel as $RENAMED
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import BaseModel as $RENAMED, $$$AFTER
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import $$$BEFORE, BaseModel as $RENAMED, $$$AFTER
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
    - not:
        all:
          - any:
              - has:
                  field: superclasses
                  kind: argument_list
                  has:
                    kind: keyword_argument
                    regex: ^frozen\s*=\s*True$
              - has:
                  field: body
                  kind: block
                  has:
                    kind: expression_statement
                    has:
                      kind: assignment
                      all:
                        - has:
                            field: left
                            kind: identifier
                            regex: ^model_config$
                        - has:
                            field: right
                            any:
                              - kind: call
                                has:
                                  kind: argument_list
                                  has:
                                    kind: keyword_argument
                                    regex: ^frozen\s*=\s*True$
                              - kind: dictionary
                                has:
                                  kind: pair
                                  regex: '^["'']frozen["'']\s*:\s*True$'
          - any:
              - has:
                  field: superclasses
                  kind: argument_list
                  has:
                    kind: keyword_argument
                    regex: ^extra\s*=\s*["']forbid["']$
              - has:
                  field: body
                  kind: block
                  has:
                    kind: expression_statement
                    has:
                      kind: assignment
                      all:
                        - has:
                            field: left
                            kind: identifier
                            regex: ^model_config$
                        - has:
                            field: right
                            any:
                              - kind: call
                                has:
                                  kind: argument_list
                                  has:
                                    kind: keyword_argument
                                    regex: ^extra\s*=\s*["']forbid["']$
                              - kind: dictionary
                                has:
                                  kind: pair
                                  regex: '^["'']extra["'']\s*:\s*["'']forbid["'']$'
          - any:
              - has:
                  field: superclasses
                  kind: argument_list
                  has:
                    kind: keyword_argument
                    regex: ^strict\s*=\s*True$
              - has:
                  field: body
                  kind: block
                  has:
                    kind: expression_statement
                    has:
                      kind: assignment
                      all:
                        - has:
                            field: left
                            kind: identifier
                            regex: ^model_config$
                        - has:
                            field: right
                            any:
                              - kind: call
                                has:
                                  kind: argument_list
                                  has:
                                    kind: keyword_argument
                                    regex: ^strict\s*=\s*True$
                              - kind: dictionary
                                has:
                                  kind: pair
                                  regex: '^["'']strict["'']\s*:\s*True$'
          - any:
              - has:
                  field: superclasses
                  kind: argument_list
                  has:
                    kind: keyword_argument
                    regex: ^validate_default\s*=\s*True$
              - has:
                  field: body
                  kind: block
                  has:
                    kind: expression_statement
                    has:
                      kind: assignment
                      all:
                        - has:
                            field: left
                            kind: identifier
                            regex: ^model_config$
                        - has:
                            field: right
                            any:
                              - kind: call
                                has:
                                  kind: argument_list
                                  has:
                                    kind: keyword_argument
                                    regex: ^validate_default\s*=\s*True$
                              - kind: dictionary
                                has:
                                  kind: pair
                                  regex: '^["'']validate_default["'']\s*:\s*True$'
          - any:
              - has:
                  field: superclasses
                  kind: argument_list
                  has:
                    kind: keyword_argument
                    regex: ^revalidate_instances\s*=\s*["']always["']$
              - has:
                  field: body
                  kind: block
                  has:
                    kind: expression_statement
                    has:
                      kind: assignment
                      all:
                        - has:
                            field: left
                            kind: identifier
                            regex: ^model_config$
                        - has:
                            field: right
                            any:
                              - kind: call
                                has:
                                  kind: argument_list
                                  has:
                                    kind: keyword_argument
                                    regex: ^revalidate_instances\s*=\s*["']always["']$
                              - kind: dictionary
                                has:
                                  kind: pair
                                  regex: '^["'']revalidate_instances["'']\s*:\s*["'']always["'']$'
