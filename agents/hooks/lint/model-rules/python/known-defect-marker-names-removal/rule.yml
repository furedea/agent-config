# M-60 a known-defect marker (xfail) carries a comment naming the condition for removing it
# (agents/skills/python-style/references/testing.md). Advisory (ADR-0021).
id: known-defect-marker-names-removal
language: Python
kind: noul
subject: node
# The comment sits above the decorators, outside the decorated definition, so the arm that sends the file is used.
state: located
# Cutoff 0.52: jev-lint's fitted midpoint on this folder's fixtures (4 violations, 4 conforming cases, 3 passes,
# means), where the loudest conforming case scored 0.24 and the quietest violation 0.80 (baseline.json, 2026-11-18).
threshold: 0.52
inconclusive: >-
  Blind: the conforming cases score at most 0.24 and the violations at least 0.80, both a quarter of the scale or more
  from the cutoff, so this corpus cannot see the rule drift. The hard conforming cases written for it still answered
  far below the cutoff; a boundary case needs real code that reviewers argue over, and none has been found yet.
axis: file
severity: warning
rule:
  all:
    - kind: decorated_definition
    - has:
        kind: decorator
        regex: xfail
ask: >-
  This test is marked as an expected failure without a comment that names the condition under which the marker is
  removed.
criteria:
  "true": >-
    No comment sits next to the marker, or the comment only says that the test is broken or to fix it later, without
    naming a condition such as a fixed defect, a released dependency version, or a finished feature.
  "false": >-
    A comment next to the marker names the condition for removing it.
