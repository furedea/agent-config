id: tsx_no_other_test_framework
language: tsx
severity: error
message: "Importing another test framework splits the test suite across runners; this project runs vitest only."
note: "Import from vitest instead: `import { describe, it, expect, vi } from \"vitest\"`, and use `vi.fn()` where `jest.fn()` was used."
rule:
  any:
    - all:
        - kind: import_statement
        - has:
            field: source
            kind: string
            regex: ^["'](jest|@jest/globals|mocha|node:test|bun:test|ava|tap|tape|jasmine|uvu|qunit)["']$
    - pattern: jest.$METHOD($$$ARGS)
    - all:
        - kind: export_statement
        - has:
            field: source
            kind: string
            regex: ^["'](jest|@jest/globals|mocha|node:test|bun:test|ava|tap|tape|jasmine|uvu|qunit)["']$
    - all:
        - kind: call_expression
        - has: { field: function, regex: ^(import|require)$ }
        - has:
            field: arguments
            regex: ^\(["'](jest|@jest/globals|mocha|node:test|bun:test|ava|tap|tape|jasmine|uvu|qunit)["']\)$
