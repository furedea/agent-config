id: py_dataclass_slots
valid:
  - |
    from functools import cached_property as cached


    def make() -> None:
        @dataclass(frozen=True)
        class Report:
            rows: tuple[int, ...]

            @cached
            def total(self) -> int:
                return sum(self.rows)
  - |
    from functools import cached_property as cached


    @dataclass(frozen=True)
    class Report:
        rows: tuple[int, ...]

        @cached
        def total(self) -> int:
            return sum(self.rows)
  - |
    @dataclass(frozen=True, slots=True)
    class Age:
        value: int
  - |
    @dataclasses.dataclass(slots=True)
    class Capture:
        total: int
  - |
    @dataclass(frozen=True)
    class Report:
        rows: tuple[int, ...]

        @cached_property
        def total(self) -> int:
            return sum(self.rows)
  - |
    @functools.total_ordering
    class Age:
        value: int
  - |
    from functools import lru_cache, cached_property as cached


    @dataclass(frozen=True)
    class Report:
        rows: tuple[int, ...]

        @cached
        def total(self) -> int:
            return sum(self.rows)
invalid:
  - |
    @dataclass
    class Age:
        value: int
  - |
    @dataclass(frozen=True)
    class Age:
        value: int
  - |
    @dataclasses.dataclass(frozen=True)
    class Age:
        value: int
  - |
    @dataclass(slots=False)
    class Capture:
        total: int
