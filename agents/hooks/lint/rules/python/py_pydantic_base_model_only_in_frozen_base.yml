id: py_pydantic_base_model_only_in_frozen_base
language: python
severity: error
message: "Inherit `FrozenBaseModel` instead of pydantic's `BaseModel`; only the class named `FrozenBaseModel` may inherit `BaseModel` directly."
note: "Resolves `pydantic.BaseModel`, `import pydantic as pd` + `pd.BaseModel`, `from pydantic import BaseModel` and `from pydantic import BaseModel as X`. Another library's `BaseModel` (for example SQLModel) and `pydantic_settings.BaseSettings` are not judged."
rule:
  kind: class_definition
  all:
    - not:
        has:
          field: name
          regex: ^FrozenBaseModel$
    - any:
        - has:
            field: superclasses
            kind: argument_list
            has:
              kind: attribute
              regex: ^pydantic\.BaseModel$
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: import pydantic as $ALIAS
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $ALIAS.BaseModel
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  kind: import_from_statement
                  regex: '(?s)^from\s+pydantic\s+import\b.*\bBaseModel\s*(,|\)|$)'
            - has:
                field: superclasses
                kind: argument_list
                has:
                  kind: identifier
                  regex: ^BaseModel$
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import BaseModel as $RENAMED
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import $$$BEFORE, BaseModel as $RENAMED
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import BaseModel as $RENAMED, $$$AFTER
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
        - all:
            - inside:
                kind: module
                stopBy: end
                has:
                  pattern: from pydantic import $$$BEFORE, BaseModel as $RENAMED, $$$AFTER
            - has:
                field: superclasses
                kind: argument_list
                has:
                  pattern: $RENAMED
