id: ts_catch_rethrow_requires_cause
valid:
  - |
    try {
      run();
    } catch (error) {
      throw new Error("read config", { cause: error });
    }
  - |
    try {
      run();
    } catch (error) {
      throw error;
    }
  - |
    request().catch((error) => {
      throw new Error("request failed", { cause: error });
    });
  - |
    request().catch(() => {
      throw new Error("request failed");
    });
  - |
    request().then((value) => {
      throw new Error("bad value");
    });
  - |
    try {
      run();
    } catch {
      throw new Error("read config");
    }
  - |
    function validate(value: string): void {
      throw new Error("value is empty");
    }
  - |
    try {
      run();
    } catch (error) {
      throw new Error("read config", options);
    }
invalid:
  - |
    try {
      run();
    } catch (error) {
      throw new Error("read config");
    }
  - |
    request().catch((error) => {
      throw new Error("request failed");
    });
  - |
    request().catch(function (error) {
      throw new TypeError("request failed");
    });
  - |
    try {
      run();
    } catch (error) {
      throw new Error("read config", {});
    }
  - |
    try {
      run();
    } catch (error) {
      throw new Error("read config", { retries: 1 });
    }
  - |
    try {
      run();
    } catch (error) {
      if (retried) {
        throw new TypeError(`read ${path}`);
      }
    }
