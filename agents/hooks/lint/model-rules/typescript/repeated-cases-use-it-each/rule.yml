# Repeated cases of one behaviour use it.each (agents/skills/typescript-style/references/testing.md). Advisory.
id: repeated-cases-use-it-each
languages: [ TypeScript, Tsx ]
kind: noul
subject: node
state: local
# The cutoff is jev-lint's fitted midpoint on this folder's fixtures (4 violations, 4 conforming cases, 3 passes,
# means, #220): the highest conforming case scored 0.08 (0.09 in its worst pass) and the lowest violation 0.43 (0.41
# in its worst pass). A fit on so few cases is not a calibration, so the rule stays advisory (ADR-0021).
threshold: 0.25
axis: file
severity: warning
rule:
  any:
    - all:
        - kind: call_expression
        - has: { field: function, regex: '^(describe|suite)(\.|$)' }
        - not:
            has: { field: function, kind: member_expression, regex: '\.each$' }
    - all:
        - kind: program
        - has:
            kind: expression_statement
            has:
              kind: call_expression
              has: { field: function, regex: '^(it|test)(\.|$)' }
ask: >-
  This test group (a `describe` block, or the top level of a test file) repeats the same test body for different inputs as separate tests instead of one `it.each` table.
criteria:
  "true": >-
    Two or more tests differ only in their input and expected value, with the same arrange and assert steps, so they could
    be rows of one `it.each` table.
  "false": >-
    Each test checks a different behaviour, or has different setup or assertions, or the repeated cases already use
    `it.each` or `test.each`.
