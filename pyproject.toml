[project]
name = "agent-config"
version = "0.1.0"
description = "Personal agent-harness source, its tests, and the server bootstrap."
requires-python = ">= 3.15.2, < 3.16"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-n", "auto"]
markers = ["integration: requires installed toolchains, provider CLIs, or the managed macOS profile"]

[tool.deptry]
ignore_notebooks = true
# Standalone hooks import these adjacent repository modules after trusted path setup.
known_first_party = [
  "audit_log",
  "automation_options",
  "automation_paths",
  "check_evidence",
  "check_execution",
  "check_selection",
  "cleanup_worktrees",
  "command_objections",
  "command_policy",
  "dev_shell",
  "fish_script",
  "foreign_shell_policy",
  "powershell_options",
  "primary_workspaces",
  "git_safety",
  "go_selection",
  "guard_command",
  "guard_file",
  "guard_git",
  "guard_suppression",
  "herdr_grammar",
  "herdr_ownership",
  "hook_decision",
  "hook_dispatch",
  "hook_input",
  "javascript_runner",
  "lib",
  "lint_format",
  "literal_words",
  "model_rules_credentials",
  "model_rules_gate",
  "model_rules_outcome",
  "model_rules_report",
  "model_rules_run",
  "patch_input",
  "provider_adapter",
  "rust_targets",
  "secret_path_policy",
  "shell_input",
  "shell_inspection",
  "shell_paths",
  "shell_syntax",
  "shell_words",
  "shell_wrappers",
  "session_gate",
  "session_snapshot",
  "session_store",
  "source_listing",
  "static_rule_scan",
  "trusted_owners",
  "verification_session",
]

[tool.vulture]
paths = ["agents", "scripts", "tests"]
min_confidence = 100
sort_by_size = true
exclude = [".venv", "build", "dist"]

[tool.uv]
managed = true
package = false
default-groups = ["lint", "typecheck", "test"]
exclude-newer = "1 week"

[dependency-groups]
lint = [
  "ruff==0.17.0",
]
typecheck = [
  "ty==0.0.87",
]
test = [
  "hypothesis>=6.170.14",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-mock==3.15.1",
  "pytest-xdist==3.8.0",
  "z3-solver>=5.3.3.0",
]
audit = [
  "deptry==0.25.1",
  "vulture==2.16",
]

[tool.ruff]
target-version = "py315"
src = ["agents", "scripts", "tests"]
line-length = 119

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
  "AIR",
  "FAST",
  "YTT",
  "ANN",
  "ASYNC",
  "B",
  "A",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "FIX",
  "FA",
  "INT",
  "LOG",
  "G",
  "PIE",
  "PYI",
  "Q",
  "SLOT",
  "TID",
  "TD",
  "ARG",
  "PTH",
  "FLY",
  "I",
  "NPY",
  "PD",
  "PERF",
  "E",
  "W",
  "D",
  "DOC",
  "N",
  "F",
  "PGH",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "UP",
  "FURB",
  "RUF",
  "INP",
  "C901",
  "PLR1702",
]
ignore = [
  # E402: hooks import adjacent modules after the trusted sys.path setup, so imports cannot sit at the top
  "E402",
  "INP001",
  "PLR2004",
  # PLR0917: PLR0913 (max-args = 3) already caps the total, which bounds the positional count
  "PLR0917",
  "D104",
  "D105",
  "D107",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 3
max-nested-blocks = 2

[tool.ty.src]
include = ["agents", "scripts", "tests"]

[tool.ty.environment]
# Hooks resolve their sibling modules through sys.path at runtime, so ty needs the same roots.
extra-paths = ["agents/hooks", "agents/hooks/lib"]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.rules]
deprecated = "warn"

invalid-argument-type = "error"
invalid-assignment = "error"
invalid-attribute-access = "error"
invalid-method-override = "error"
invalid-parameter-default = "error"
invalid-return-type = "error"
invalid-type-arguments = "error"

missing-argument = "error"
no-matching-overload = "error"
not-subscriptable = "error"

unresolved-attribute = "error"
unresolved-import = "error"
unresolved-reference = "error"

possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
redundant-cast = "warn"
unknown-argument = "warn"
unused-type-ignore-comment = "warn"

[tool.ty.terminal]
error-on-warning = false
