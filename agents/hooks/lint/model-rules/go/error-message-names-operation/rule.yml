# M-21 error messages name the operation and the subject (agents/skills/go-style/references/errors.md: "Wrap with the
# operation and subject"). Advisory (ADR-0021). The cutoff 0.48 is jev-lint's fitted midpoint on this folder's
# fixtures (eval of 2026-11-18, 3 passes): the highest clean case scored 0.28 and the lowest bad one 0.67 (a message
# that names only the operation and wraps the cause).
id: error-message-names-operation
language: Go
divergent: Go builds an error with errors.New or fmt.Errorf where Python raises and TypeScript throws.
kind: noul
subject: node
# The file is sent whole: a message built by a helper or a sentinel error is defined elsewhere in the file, and
# `located` measured no false positive for the same cause in the Python rule.
state: located
threshold: 0.48
# The fixtures sit far from the cutoff on both sides (highest clean and lowest bad: 0.28 and 0.67), so replay
# calls the suite blind; a boundary fixture would need a case a reviewer would argue over.
inconclusive: >-
  Blind: every fixture is clearly clean or clearly defective and no boundary case exists yet; the next one to
  add is a message whose operation is implied only by the wrapped cause.
axis: file
severity: warning
# Only functions that build an error are asked about; a function that merely returns a received error is not a subject.
# An aliased import of fmt or errors is not followed: a syntactic matcher cannot resolve the alias, and widening the
# regex to any `.New(` or `.Errorf(` would select every constructor and logger call.
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: method_declaration
    - has:
        kind: call_expression
        regex: ^(errors\.New|fmt\.Errorf)\(
        stopBy: end
ask: >-
  An error built in this function carries a message that names neither the operation that failed nor the subject it
  failed on.
criteria:
  "true": >-
    An error built has a generic message such as "invalid", "error" or "failed", or one that names only the operation or
    only the subject, so a reader of the message alone cannot tell what was being done to what.
  "false": >-
    Every error built names the operation and the subject, directly or by wrapping a cause that does. Returning a
    received error unchanged is not a violation.
