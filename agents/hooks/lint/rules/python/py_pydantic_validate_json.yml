id: py_pydantic_validate_json
language: python
severity: error
message: "A strict pydantic model rejects a JSON-derived dict for datetime, UUID and similar fields, because `json.loads` leaves them as strings."
note: "Use `User.model_validate_json(raw)` instead of `User.model_validate(json.loads(raw))`; for discriminated unions use `TypeAdapter(...).validate_json(raw)`; for key renames use aliases or `model_validator(mode=\"before\")`. Judges `json.loads`, `import json as alias`, `from json import loads [as x]`, `orjson.loads` and `ujson.loads`, passed directly or through a variable assigned in the nearest enclosing function. TOML and YAML loaders are not JSON."
rule:
  any:
    # passed directly
    - pattern: $MODEL.model_validate(json.loads($$$ARGS))
    - pattern: $MODEL.model_validate(json.loads($$$ARGS), $$$REST)
    - pattern: $MODEL.model_validate(orjson.loads($$$ARGS))
    - pattern: $MODEL.model_validate(orjson.loads($$$ARGS), $$$REST)
    - pattern: $MODEL.model_validate(ujson.loads($$$ARGS))
    - pattern: $MODEL.model_validate(ujson.loads($$$ARGS), $$$REST)
    - all:
        - any:
            - pattern: $MODEL.model_validate($ALIAS.loads($$$ARGS))
            - pattern: $MODEL.model_validate($ALIAS.loads($$$ARGS), $$$REST)
        - inside:
            kind: module
            stopBy: end
            has:
              pattern: import json as $ALIAS
    - all:
        - any:
            - pattern: $MODEL.model_validate($LOADER($$$ARGS))
            - pattern: $MODEL.model_validate($LOADER($$$ARGS), $$$REST)
        - inside:
            kind: module
            stopBy: end
            has:
              pattern: from json import loads as $LOADER
    - all:
        - any:
            - pattern: $MODEL.model_validate(loads($$$ARGS))
            - pattern: $MODEL.model_validate(loads($$$ARGS), $$$REST)
        - inside:
            kind: module
            stopBy: end
            has:
              kind: import_from_statement
              regex: (?s)^from\s+json\s+import\b.*\bloads\b
    # passed through a variable assigned from the loader earlier in the nearest function, and not reassigned
    - all:
        - any:
            - pattern: $MODEL.model_validate($DATA)
            - pattern: $MODEL.model_validate($DATA, $$$REST)
        - inside:
            kind: function_definition
            stopBy:
              kind: function_definition
            all:
              - has:
                  stopBy: end
                  any:
                      - pattern: $DATA = json.loads($$$ARGS)
                      - pattern: $DATA = orjson.loads($$$ARGS)
                      - pattern: $DATA = ujson.loads($$$ARGS)
              - not:
                  has:
                    stopBy: end
                    kind: assignment
                    all:
                      - pattern: $DATA = $OTHER
                      - not:
                          any:
                            - pattern: $DATA = json.loads($$$LA)
                            - pattern: $DATA = orjson.loads($$$LA)
                            - pattern: $DATA = ujson.loads($$$LA)
        # the loader assignment must come before the validating statement
        - inside:
            stopBy:
              kind: function_definition
            all:
              - not:
                  any:
                    - kind: function_definition
                    - kind: decorated_definition
                    - kind: class_definition
              - follows:
                  stopBy: end
                  has:
                    stopBy: end
                    any:
                      - pattern: $DATA = json.loads($$$ARGS)
                      - pattern: $DATA = orjson.loads($$$ARGS)
                      - pattern: $DATA = ujson.loads($$$ARGS)
    - all:
        - any:
            - pattern: $MODEL.model_validate($DATA)
            - pattern: $MODEL.model_validate($DATA, $$$REST)
        - inside:
            kind: function_definition
            stopBy:
              kind: function_definition
            all:
              - has:
                  stopBy: end
                  any:
                      - pattern: $DATA = $ALIAS.loads($$$ARGS)
              - not:
                  has:
                    stopBy: end
                    kind: assignment
                    all:
                      - pattern: $DATA = $OTHER
                      - not:
                          any:
                            - pattern: $DATA = json.loads($$$LA)
                            - pattern: $DATA = orjson.loads($$$LA)
                            - pattern: $DATA = ujson.loads($$$LA)
                            - pattern: $DATA = $ALIAS.loads($$$LA)
        # the loader assignment must come before the validating statement
        - inside:
            stopBy:
              kind: function_definition
            all:
              - not:
                  any:
                    - kind: function_definition
                    - kind: decorated_definition
                    - kind: class_definition
              - follows:
                  stopBy: end
                  has:
                    stopBy: end
                    any:
                      - pattern: $DATA = $ALIAS.loads($$$ARGS)
        - inside:
            kind: module
            stopBy: end
            has:
              pattern: import json as $ALIAS
    - all:
        - any:
            - pattern: $MODEL.model_validate($DATA)
            - pattern: $MODEL.model_validate($DATA, $$$REST)
        - inside:
            kind: function_definition
            stopBy:
              kind: function_definition
            all:
              - has:
                  stopBy: end
                  any:
                      - pattern: $DATA = $LOADER($$$ARGS)
              - not:
                  has:
                    stopBy: end
                    kind: assignment
                    all:
                      - pattern: $DATA = $OTHER
                      - not:
                          any:
                            - pattern: $DATA = json.loads($$$LA)
                            - pattern: $DATA = orjson.loads($$$LA)
                            - pattern: $DATA = ujson.loads($$$LA)
                            - pattern: $DATA = $LOADER($$$LA)
        # the loader assignment must come before the validating statement
        - inside:
            stopBy:
              kind: function_definition
            all:
              - not:
                  any:
                    - kind: function_definition
                    - kind: decorated_definition
                    - kind: class_definition
              - follows:
                  stopBy: end
                  has:
                    stopBy: end
                    any:
                      - pattern: $DATA = $LOADER($$$ARGS)
        - inside:
            kind: module
            stopBy: end
            has:
              pattern: from json import loads as $LOADER
    - all:
        - any:
            - pattern: $MODEL.model_validate($DATA)
            - pattern: $MODEL.model_validate($DATA, $$$REST)
        - inside:
            kind: function_definition
            stopBy:
              kind: function_definition
            all:
              - has:
                  stopBy: end
                  any:
                      - pattern: $DATA = loads($$$ARGS)
              - not:
                  has:
                    stopBy: end
                    kind: assignment
                    all:
                      - pattern: $DATA = $OTHER
                      - not:
                          any:
                            - pattern: $DATA = json.loads($$$LA)
                            - pattern: $DATA = orjson.loads($$$LA)
                            - pattern: $DATA = ujson.loads($$$LA)
                            - pattern: $DATA = loads($$$LA)
        # the loader assignment must come before the validating statement
        - inside:
            stopBy:
              kind: function_definition
            all:
              - not:
                  any:
                    - kind: function_definition
                    - kind: decorated_definition
                    - kind: class_definition
              - follows:
                  stopBy: end
                  has:
                    stopBy: end
                    any:
                      - pattern: $DATA = loads($$$ARGS)
        - inside:
            kind: module
            stopBy: end
            has:
              kind: import_from_statement
              regex: (?s)^from\s+json\s+import\b.*\bloads\b
