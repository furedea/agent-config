id: ts_no_unvalidated_json_cast
language: typescript
severity: warning
message: "Parse external input as `unknown` and validate it instead of asserting its type."
note: "`JSON.parse` and `Response.json()` return `any`; asserting or annotating the result skips the validation the boundary needs."
rule:
  any:
    - pattern: JSON.parse($$$ARGS) as $TYPE
    - pattern: (await $RESPONSE.json()) as $TYPE
    - pattern: JSON.parse($$$ARGS) as unknown as $TYPE
    - pattern: JSON.parse($$$ARGS) satisfies $TYPE
    - pattern: (await $RESPONSE.json()) satisfies $TYPE
    - pattern: await $RESPONSE.json() satisfies $TYPE
    - pattern: await $RESPONSE.json() as $TYPE
    - pattern: await $RESPONSE.json() as unknown as $TYPE
    - pattern: (await $RESPONSE.json()) as unknown as $TYPE
    - pattern: <$TYPE>JSON.parse($$$ARGS)
    - pattern: <$TYPE>(await $RESPONSE.json())
    - pattern: $RESPONSE.json() as $TYPE
    - all:
        - any:
            - kind: variable_declarator
            - kind: public_field_definition
        - has:
            field: type
            kind: type_annotation
            not: { regex: ':\s*(Promise<unknown>|unknown)$' }
        - has:
            field: value
            any:
              - pattern: JSON.parse($$$ARGS)
              - pattern: await $RESPONSE.json()
              - pattern: $RESPONSE.json()
    - all:
        - kind: arrow_function
        - has:
            field: return_type
            kind: type_annotation
            not: { regex: ':\s*(Promise<unknown>|unknown)$' }
        - has:
            field: body
            any:
              - pattern: JSON.parse($$$ARGS)
              - pattern: await $RESPONSE.json()
              - pattern: $RESPONSE.json()
    - all:
        - kind: return_statement
        - has:
            any:
              - pattern: JSON.parse($$$ARGS)
              - pattern: await $RESPONSE.json()
              - pattern: $RESPONSE.json()
        - inside:
            any:
              - kind: function_declaration
              - kind: function_expression
              - kind: arrow_function
              - kind: method_definition
            has:
              field: return_type
              kind: type_annotation
              not: { regex: ':\s*(Promise<unknown>|unknown)$' }
            stopBy:
              any:
                - kind: function_declaration
                - kind: function_expression
                - kind: arrow_function
                - kind: method_definition
constraints:
  TYPE:
    not:
      regex: ^unknown$
