id: rs_no_path_from_format
language: rust
severity: warning
message: "Build a path with `Path::join` / `PathBuf::push`, not by formatting a string."
rule:
  any:
    - pattern: PathBuf::from(format!($$$ARGS))
    - pattern: std::path::PathBuf::from(format!($$$ARGS))
    - pattern: PathBuf::from($A + $B)
    - pattern: std::path::PathBuf::from($A + $B)
    - pattern: Path::new(&format!($$$ARGS))
    - pattern: std::path::Path::new(&format!($$$ARGS))
    - pattern: Path::new(&($A + $B))
    - pattern: std::path::Path::new(&($A + $B))
