id: py_no_staticmethod
source:
  link: agents/skills/python-style/references/models.md#L34
  quote: "Basically don't use `@staticmethod` — needing it indicates a design error"
language: python
method: ast-grep
version: 1
examples:
  conforming:
    - |
      class Counter:
          def total(self) -> int:
              return 0
  violating:
    - |
      class Counter:
          @staticmethod
          def total() -> int:
              return 0
severity: warning
message: "Avoid `@staticmethod`; move the function to module level or make it a method that uses the instance."
rule:
  kind: decorator
  pattern: "@staticmethod"
