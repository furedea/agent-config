id: bash_strict_mode_header
valid:
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    echo hi
  - |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    echo hi
  - |
    #!/usr/bin/env bash
    set -euCo pipefail
    echo hi
  - |
    #!/usr/bin/env bash
    set -o errexit -o nounset -o pipefail
    echo hi
  - |
    #!/usr/bin/env bash
    set -eu
    set -o pipefail
    echo hi
  - |
    #!/usr/bin/env bash
    set -e -u -o pipefail
    echo hi
  - |
    #!/usr/bin/env bash
    # comments and function definitions may come before it
    usage() { :; }
    set -euo pipefail
    echo hi
  - |
    #!/usr/bin/env bats
    @test "x" { true; }
  - |
    # sourced library without a shebang
    helper() { :; }
invalid:
  - |
    #!/usr/bin/env bash
    set -eu
    set +o pipefail
    echo hi
  - |
    #!/usr/bin/env bash
    set -eu
    set -- pipefail
    echo hi
  - |
    #!/usr/bin/env bash
    echo hi
  - |
    #!/usr/bin/env bash
    set -eu
    echo hi
  - |
    #!/usr/bin/env bash
    set -o pipefail
    echo hi
  - |
    #!/usr/bin/env bash
    set -eo pipefail
    echo hi
  - |
    #!/usr/bin/env bash
    set -e -o pipefail
    echo hi
  - |
    #!/usr/bin/env bash
    echo hi
    set -euo pipefail
  - |
    #!/usr/bin/env bash
    cd /tmp
    set -euo pipefail
  - |
    #!/usr/bin/env bash
    main() {
      set -euo pipefail
    }
  - |
    #!/usr/bin/env bash
    ls -eu
    pipefail=1
