id: rs_no_get_prefix
language: rust
severity: warning
message: "Avoid a Java-style `get_` prefix; name the accessor after the value (`len`, `status`) or use `as_*` / `into_*`."
rule:
  all:
    - any:
        - kind: function_item
        - kind: function_signature_item
    - has:
        field: name
        kind: identifier
        regex: ^get_.
        not:
          regex: ^get_(mut|unchecked|unchecked_mut)$
    # An FFI declaration or export is named by its C symbol.
    - not:
        inside:
          kind: foreign_mod_item
          stopBy: end
    - not:
        has:
          kind: function_modifiers
          regex: extern
    # A trait implementation cannot rename the method the trait fixes.
    - not:
        inside:
          kind: impl_item
          stopBy: end
          has:
            field: trait
            regex: .
