# Go errors (agents/skills/go-style/references/errors.md: "Do not log and return the same error; handle it at one
# level, usually the outermost"). Advisory (ADR-0021). The cutoff is the 0.5 starting value, not fitted.
id: error-handled-once
language: Go
kind: noul
subject: node
state: local
threshold: 0.5
axis: file
severity: warning
# Only functions that log are asked about; a function that never logs cannot log and return the same error.
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: method_declaration
    - has:
        kind: call_expression
        regex: ^(slog|log)\.|[lL]og(ger)?\.(Debug|Info|Warn|Error)(Context)?\(
        stopBy: end
ask: >-
  This function logs an error and also returns that same error, or a wrapped form of it, to its caller.
criteria:
  "true": >-
    On some path the function writes an error to a log and then returns that error (or an error wrapping it), so the
    caller will handle or log it again.
  "false": >-
    Every error is either logged and swallowed, or returned without being logged. A log of a value that is not the
    returned error, or of an error that is then recovered from, is not a violation.
