# M-31 separate construction from execution (agents/AGENTS.md: "separate object creation/configuration from execution
# logic"). Advisory (ADR-0021). Only functions that construct a collaborator (a name ending in Client, Service,
# Repository, Connection and the like) are asked about, to spare the shared Stop subject budget; errors, standard
# collections and value objects are not selected. The first criteria scored a composition root as a violation (0.93
# against 0.95 for the lowest bad case); the criteria now exclude it. The cutoff 0.6 is jev-lint's fitted midpoint on
# this folder's fixtures (eval of 2026-11-18, 3 passes, after the criteria rewrite): the highest clean case scored
# 0.24 (a short-lived reader over an injected client) and the lowest bad one 0.95.
id: construction-separate-from-execution
language: Go
kind: noul
subject: node
state: local
threshold: 0.6
axis: file
severity: warning
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: method_declaration
    - has:
        kind: call_expression
        stopBy: end
        any:
          - regex: "^([A-Za-z_]\\w*\\.)?New\\w*(Client|Service|Repository|Connection|Session|Parser|Engine|Manager|Adapter|Gateway|Store|Factory|Handler|Loader|Reader|Writer|Server|Pool|Provider|Runner)\\("
          # A package named for its collaborator (`client.New(...)`); standard errors, IDs, hashes and containers are
          # not collaborators.
          - all:
              - regex: "^[a-z]\\w*\\.New\\("
              - not:
                  regex: "^(errors|xerrors|uuid|list|ring|heap|template|rand|sha1|sha256|sha512|md5|hmac|fnv|crc32|crc64|adler32)\\.New\\("
ask: >-
  This function creates and configures its own collaborators and then, in the same body, runs the logic that uses
  them.
criteria:
  "true": >-
    The body constructs a service, client, connection, repository, parser or similar collaborator, configures it
    (options, credentials, wiring), and then runs business logic with it in the same body, such as loops, conditions
    or decisions over domain data, so that testing that logic requires building the collaborator inside this function.
  "false": >-
    The collaborator is passed in; or the function only constructs and returns (a factory, a builder); or it is a
    composition root that builds collaborators and hands them to one call that runs the logic elsewhere, with no loop
    or decision of its own over domain data; or it only executes with what it was given. Creating plain data, value
    objects, local collections, or a short-lived helper that wraps an injected collaborator is not a violation.
