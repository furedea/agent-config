id: py_xfail_requires_strict
language: python
severity: error
message: "A non-strict xfail keeps passing silently when the bug is fixed, so the marker goes stale."
note: "Change `@pytest.mark.xfail(reason=\"...\")` to `@pytest.mark.xfail(strict=True, reason=\"...\")`."
rule:
  any:
    - all:
        - pattern: pytest.mark.xfail($$$ARGS)
        - not:
            has:
              kind: argument_list
              has:
                kind: keyword_argument
                regex: ^strict\s*=\s*True$
    # The bare form (`@pytest.mark.xfail`, `pytestmark = pytest.mark.xfail`) is never strict.
    - all:
        - pattern: pytest.mark.xfail
        - not:
            inside:
              kind: call
