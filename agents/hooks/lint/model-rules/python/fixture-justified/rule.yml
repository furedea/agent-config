# agents/skills/python-style/references/testing.md: a fixture is for setup shared across two or more tests, external
# resources, or teardown via yield; otherwise a helper function, and a wider scope only for expensive setup. The
# whole file is sent so the model can count the tests that use the fixture. Advisory (ADR-0021).
id: fixture-justified
language: Python
kind: noul
subject: node
state: located
# Cutoff 0.54: jev-lint's fitted midpoint on this folder's fixtures (4 violations, 4 conforming cases, 3 passes,
# means), where the loudest conforming case scored 0.13 and the quietest violation 0.94 (baseline.json, 2026-11-18).
threshold: 0.54
inconclusive: >-
  Blind: the conforming cases score at most 0.13 and the violations at least 0.94, both a quarter of the scale or more
  from the cutoff, so this corpus cannot see the rule drift. The hard conforming cases written for it still answered
  far below the cutoff; a boundary case needs real code that reviewers argue over, and none has been found yet.
axis: file
severity: warning
rule:
  all:
    - kind: decorated_definition
    - has:
        kind: decorator
        regex: ^@(pytest\.)?(\w+_)?fixture\b
ask: >-
  This fixture is not justified by shared setup, an external resource, or teardown, or its scope is wider than its setup
  cost needs.
criteria:
  "true": >-
    Fewer than two tests in this file use the fixture, it is not defined in `conftest.py`, and it neither manages an
    external resource nor tears anything down after `yield`; and within that case its setup is lightweight or the
    test needs to pass arguments to it, so a helper function would do, or its scope is `module` or `session` although
    its setup is cheap.
  "false": >-
    Two or more tests use the fixture, whatever its cost or scope; or the fixture is defined in `conftest.py` (its
    users are in other files that are not shown); or it manages an external resource or tears down after `yield`; or
    it needs a wider scope because its setup is expensive.
