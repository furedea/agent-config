id: py_plain_class_slots
language: python
severity: error
message: "Declare `__slots__` on a plain class that sets attributes in `__init__`."
note: "Only dataclass-like decorators (dataclass, attrs) exempt a class; other decorators such as `final` do not. A class that uses `cached_property` is skipped, because it needs the instance `__dict__`. Classes with a base class or a decorator (dataclass, pydantic, Enum, Protocol, exceptions) are skipped, because `__slots__` is for classes that use neither dataclasses nor pydantic."
rule:
  kind: class_definition
  all:
    - not:
        has:
          field: superclasses
          kind: argument_list
    - not:
        inside:
          kind: decorated_definition
          has:
            kind: decorator
            regex: ^@(\w+\.)*(dataclass|define|frozen|mutable|s|attrs)\b
    - has:
        field: body
        kind: block
        has:
          kind: function_definition
          all:
            - has:
                field: name
                regex: ^__init__$
            - has:
                field: body
                kind: block
                has:
                  stopBy: end
                  kind: assignment
                  has:
                    field: left
                    any:
                      - kind: attribute
                        regex: ^self\.
                      - has:
                          stopBy: end
                          kind: attribute
                          regex: ^self\.
    - not:
        has:
          pattern: cached_property
          stopBy: end
    - not:
        all:
          - inside:
              kind: module
              has:
                pattern: from functools import cached_property as $CACHED
          - has:
              stopBy: end
              kind: decorator
              pattern: "@$CACHED"
    - not:
        has:
          field: body
          kind: block
          has:
            kind: expression_statement
            regex: ^__slots__\s*(:[^=]*)?=
