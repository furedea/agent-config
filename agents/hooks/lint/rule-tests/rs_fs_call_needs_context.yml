id: rs_fs_call_needs_context
valid:
  - |
    fn f(p: &Path) -> Result<String> {
        std::fs::read_to_string(p).with_context(|| format!("read {}", p.display()))
    }
  - |
    fn f(p: &Path) -> Result<String> {
        let s = fs::read_to_string(p).map_err(|e| Error::new(p, e))?;
        Ok(s)
    }
  - |
    fn f(p: &Path) -> Result<String> {
        let s = fs::read_to_string(p).with_context(|| "read")?;
        Ok(s)
    }
  - |
    fn f(p: &Path) -> Result<File> {
        let f = OpenOptions::new().read(true).open(p).with_context(|| "open")?;
        Ok(f)
    }
  - |
    fn f(p: &Path) -> Result<PathBuf> {
        let c = p.canonicalize().with_context(|| format!("resolve {}", p.display()))?;
        Ok(c)
    }
  - |
    fn f(client: &Client) -> Result<Meta> {
        let m = client.metadata()?;
        Ok(m)
    }
invalid:
  - |
    fn f(p: &Path) -> Result<String> {
        let s = std::fs::read_to_string(p)?;
        Ok(s)
    }
  - |
    fn f(p: &Path) -> Result<()> {
        fs::write(p, "x")?;
        Ok(())
    }
  - |
    fn f(p: &Path) -> Result<()> {
        let _f = File::open(p)?;
        Ok(())
    }
  - |
    fn f(p: &Path) -> Result<()> {
        let _f = fs::File::open(p)?;
        Ok(())
    }
  - |
    fn f(p: &Path) -> Result<()> {
        let _f = OpenOptions::new().read(true).open(p)?;
        Ok(())
    }
  - |
    fn f(p: &Path) -> Result<PathBuf> {
        let c = p.canonicalize()?;
        Ok(c)
    }
  - |
    fn f(p: &Path) -> Result<u64> {
        Ok(p.symlink_metadata()?.len())
    }
