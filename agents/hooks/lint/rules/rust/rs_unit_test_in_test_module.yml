id: rs_unit_test_in_test_module
language: rust
severity: error
message: "Put a unit test in `#[cfg(test)] mod tests`, or move it to `tests/` when it exercises the public API. A file that a `#[cfg(test)] mod` includes should start with `#![cfg(test)]`."
files:
  - "**/src/**/*.rs"
ignores:
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
rule:
  all:
    - kind: function_item
    - follows:
        kind: attribute_item
        regex: ^#\[(cfg_attr\([^\]]*,\s*)?((([A-Za-z_][A-Za-z0-9_]*::)*test)|rstest|test_case)\b
        stopBy:
          not:
            any:
              - kind: attribute_item
              - kind: line_comment
    # A file that is itself compiled only for tests (`#![cfg(test)]`).
    - not:
        inside:
          kind: source_file
          stopBy: end
          has:
            kind: inner_attribute_item
            regex: ^#!\[cfg\((test|all\((.*,\s*)?test\s*[,)])
    # Inside a module that is compiled only for tests.
    - not:
        inside:
          kind: mod_item
          stopBy: end
          follows:
            kind: attribute_item
            regex: ^#\[cfg\((test|all\((.*,\s*)?test\s*[,)])
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
