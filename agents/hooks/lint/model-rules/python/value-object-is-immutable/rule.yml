# agents/skills/python-style/references/models.md: value objects are frozen (frozen dataclass or a frozen pydantic
# model). py_dataclass_slots cannot tell a value object from a mutable record, so the model decides. Advisory
# (ADR-0021).
id: value-object-is-immutable
language: Python
kind: noul
subject: node
state: located
# Cutoff 0.53: jev-lint's fitted midpoint on this folder's fixtures (4 violations, 5 conforming cases, 3 passes,
# means), where the loudest conforming case scored 0.15 and the quietest violation 0.89 (baseline.json, 2026-11-18).
threshold: 0.53
inconclusive: >-
  Blind: the conforming cases score at most 0.15 and the violations at least 0.89, both a quarter of the scale or more
  from the cutoff, so this corpus cannot see the rule drift. The hard conforming cases written for it still answered
  far below the cutoff; a boundary case needs real code that reviewers argue over, and none has been found yet.
axis: file
severity: warning
rule:
  all:
    - kind: class_definition
    - any:
        - inside:
            kind: decorated_definition
            has:
              kind: decorator
              regex: dataclass
        - has:
            field: superclasses
            kind: argument_list
            has:
              any:
                - kind: identifier
                - kind: attribute
              regex: ^(pydantic\.)?BaseModel$
ask: >-
  This class models a value, but it is declared mutable.
criteria:
  "true": >-
    The class represents a value without identity (an amount, an identifier, a range, a configuration, a parsed record)
    that is compared by its fields and not changed after construction, yet it is not frozen: a dataclass without
    `frozen=True`, or a pydantic model without `frozen=True` in its config or a frozen base class.
  "false": >-
    The class is frozen, or it is a mutable record, entity, builder, accumulator, or state holder whose fields are
    assigned after construction.
