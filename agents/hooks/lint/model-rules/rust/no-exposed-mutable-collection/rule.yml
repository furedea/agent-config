# M-34 collection objects (agents/AGENTS.md: "do not expose mutable raw collections"). Advisory: the Stop hook reports
# findings and never promotes this rule to a gate (ADR-0021). Selected by a function that returns a field or a mutable
# reference; the criteria require the collection to be the object's own state.
id: no-exposed-mutable-collection
language: Rust
kind: noul
subject: node
# The struct that owns the field, its documentation and its other methods sit outside the method's `impl` block, so the
# whole file is sent: under `local` every `&mut` collection looked like protected state (4 of 4 clean cases flagged).
state: located
threshold: 0.5
axis: file
severity: warning
rule:
  all:
    - kind: function_item
    - has:
        field: return_type
        regex: "&\\s*mut\\s+(\\[|[A-Za-z_:]*(Vec|Map|Set|Deque|Heap)\\b)"
ask: >-
  This function hands the caller the object's own mutable collection, so the caller can change its state without the
  object noticing.
criteria:
  "true": >-
    The function is a method that returns `&mut` access to a collection held in a private field of its own type, and
    the type keeps a rule over that collection (sorted, unique, bounded, in step with another field, only partly
    valid), stated in its documentation or enforced by its other methods, which the caller can now break.
  "false": >-
    The type keeps no rule over the collection: its fields are public anyway, or it is a plain data record or a
    newtype over raw values documented as accepting any content. Also not a violation: a free function (not a method)
    that returns a reference into a collection the caller passed in, or into an element it has just created there.
