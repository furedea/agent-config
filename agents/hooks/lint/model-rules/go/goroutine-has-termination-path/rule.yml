# Go concurrency (agents/skills/go-style/references/concurrency.md: "Give every goroutine a defined owner and a
# termination path"). Advisory (ADR-0021). The cutoff is the 0.5 starting value, not fitted; no fixtures or baseline yet.
id: goroutine-has-termination-path
language: Go
kind: noul
subject: node
# The file is sent whole: the owner (a WaitGroup, an errgroup, a done channel) is often a
# field or a type declared outside the function.
state: located
threshold: 0.5
axis: file
severity: warning
rule:
  kind: go_statement
ask: >-
  This goroutine is started with nobody waiting for its end and no way to make it stop.
criteria:
  "true": >-
    Nothing owns the goroutine: no WaitGroup, errgroup or done channel lets the caller wait for it, and the goroutine
    has no exit path tied to context cancellation or a closed channel, so it can outlive its caller or leak.
  "false": >-
    The goroutine has an owner that waits for it (errgroup, WaitGroup, a result or done channel that is received) or an
    exit path that its caller can trigger (context cancellation, a closed channel), or it is bounded by the program's
    lifetime on purpose and says so.
