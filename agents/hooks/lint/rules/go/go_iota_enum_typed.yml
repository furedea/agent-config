id: go_iota_enum_typed
language: go
severity: warning
message: "Declare the `iota` constant with its own type, e.g. `StatePending State = iota`."
note: "Whether the type has a `String()` method is not judged. A shift such as `1 << iota` and a blank `_ = iota` that is followed by a typed constant are skipped; the specs that inherit an untyped `iota` are reported through it."
rule:
  kind: const_spec
  has:
    field: value
    kind: expression_list
    regex: \biota\b
    not:
      regex: <<
  not:
    any:
      - has:
          field: type
          regex: .+
      - all:
          - has:
              field: name
              regex: ^_$
          - precedes:
              kind: const_spec
              has:
                field: type
                regex: .+
