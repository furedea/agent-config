name: Check
on: pull_request
permissions: {}
defaults:
  run:
    shell: env CHECK_PIPEFAIL=1 bash -e {0}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: find . -name '*.json' | xargs -n1 jq empty
