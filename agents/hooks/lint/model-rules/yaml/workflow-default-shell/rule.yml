# github-actions-style: `defaults.run.shell: bash` so that `run:` steps get `pipefail`. Advisory; it was a blocking
# ast-grep rule (gha_workflow_default_shell) until review showed that job-level defaults, matrix keys and custom shell
# strings cannot be told apart by syntax alone (ADR-0021).
id: workflow-default-shell
language: Yaml
kind: noul
subject: node
state: located
threshold: 0.5
axis: file
severity: warning
# A step's `run:`, wherever the workflow sets (or fails to set) the shell for it.
rule:
  all:
    - kind: block_mapping_pair
    - has: { field: key, regex: "^[\"']?run[\"']?$" }
    # Only a GitHub Actions file: a rule cannot be scoped by path, so the document must carry a `runs-on` (a workflow job)
    # or `using` (a composite action) key. A CircleCI or GitLab file with `run:` steps has neither.
    - inside:
        kind: document
        stopBy: end
        has:
          stopBy: end
          kind: block_mapping_pair
          has: { field: key, regex: "^[\"']?(runs-on|using)[\"']?$" }
    # A key of a step mapping itself, not of a nested `with:` or `env:` mapping.
    - inside:
        kind: block_mapping
        stopBy: neighbor
        inside: { kind: block_node, stopBy: neighbor, inside: { kind: block_sequence_item, stopBy: neighbor } }
ask: >-
  This `run:` step executes under a shell that does not enable `pipefail`, because neither the workflow nor the job sets
  `defaults.run.shell` and the step sets no `shell:` of its own.
criteria:
  "true": >-
    No `defaults.run.shell` at the workflow level, in the job, and no `shell:` on the step, selects a shell with
    `pipefail` (`bash`, or a custom command that passes `-o pipefail` to bash). A custom shell that only mentions the
    word `pipefail`, for example as an environment variable name, does not count.
  "false": >-
    The workflow or the job sets `defaults.run.shell: bash` (or a custom shell that enables `pipefail`), or the step
    sets such a `shell:` itself, or the runner is Windows and the step needs PowerShell, or the file is not a GitHub Actions workflow or composite action (for example CircleCI or GitLab CI).
