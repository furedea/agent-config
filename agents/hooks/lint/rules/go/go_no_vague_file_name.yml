id: go_no_vague_file_name
language: go
severity: warning
message: "Name the file by its domain or action, not a vague word like utils, helpers, manager, common, or formatter, unless the name is already established locally."
rule:
  kind: source_file
files:
  - "**/{utils,util,helpers,helper,manager,common,formatter}.go"
  - "**/*[._-]{utils,util,helpers,helper,manager,common,formatter}.go"
  - "**/{utils,util,helpers,helper,manager,common,formatter}[._-]*.go"
  - "**/*[._-]{utils,util,helpers,helper,manager,common,formatter}[._-]*.go"
