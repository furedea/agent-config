id: py_no_unittest
language: python
severity: error
message: "`unittest` test classes do not use pytest fixtures and parametrization."
note: "Write the test as a plain pytest function: `def test_x(): assert actual == expected`."
rule:
  any:
    - pattern: import unittest
    - pattern: import unittest as $ALIAS
    - all:
        - kind: import_from_statement
        - has:
            field: module_name
            regex: ^unittest$
        - not:
            pattern: from unittest import mock
        - not:
            pattern: from unittest import mock as $ALIAS
