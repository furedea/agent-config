# bash-style: "Choose the working directory by responsibility." Advisory; the prose stays until the rule is promoted
# (ADR-0021). The matcher selects the `cd` and `pushd` commands, so this rule judges only a change into the script's own
# directory; the converse (opening bundled files by a relative path that resolves from the caller's directory) has no
# command to select and stays prose.
id: working-directory-by-responsibility
language: Bash
kind: noul
subject: node
state: located
threshold: 0.5
axis: file
severity: warning
rule:
  all:
    - kind: command
    - has: { field: name, regex: "^(cd|pushd)$" }
ask: >-
  This script changes into its own directory although some of its work operates on the target project.
criteria:
  "true": >-
    The script changes the working directory to its own location (`cd "$(dirname "$0")"`) and then runs commands that
    should act on the caller's project or the current directory.
  "false": >-
    Every command after the change works on the location it changed to, or the change is confined to a subshell or a
    `pushd`/`popd` pair around one operation, or the change goes to a directory other than the script's own location.
