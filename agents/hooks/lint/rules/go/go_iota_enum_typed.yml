id: go_iota_enum_typed
language: go
severity: warning
message: "Declare the `iota` constant with its own type, e.g. `StatePending State = iota`."
note: "Whether the type has a `String()` method is not judged. Expressions such as `1 << iota` are skipped."
rule:
  kind: const_spec
  has:
    field: value
    kind: expression_list
    regex: ^iota$
  not:
    has:
      field: type
      regex: .+
