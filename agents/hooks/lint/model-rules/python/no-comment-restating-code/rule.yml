# M-33 minimal comments (agents/AGENTS.md: "minimize comments and docstrings; use them for public APIs, TODOs,
# non-obvious constraints, and intent that code cannot express"). Advisory: the Stop hook reports findings and never
# promotes this rule to a gate (ADR-0021). Selected by a comment or docstring inside the function, or a comment just
# above it or its decorators, that is not a tool directive or TODO; a comment that restates the code is the violation.
id: no-comment-restating-code
language: Python
kind: noul
subject: node
state: local
# Cutoff 0.62: the midpoint between the loudest conforming case (0.37, a public docstring) and the quietest violation
# inside a function (0.87) on this folder's fixtures (4 violations, 6 conforming cases, 3 passes, means; baseline.json,
# 2026-11-19). Limits: a comment just above a function that restates it (`_total_price`) scored 0.11, so the comment
# above a function is selected but not yet found; no cutoff separates it.
threshold: 0.62
axis: file
severity: warning
rule:
  all:
    - kind: function_definition
    - any:
        - has:
            kind: comment
            stopBy: end
            not: { regex: "^#\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" }
        - has:
            kind: expression_statement
            nthChild: 1
            has: { kind: string }
            inside: { kind: block, inside: { kind: function_definition } }
            stopBy: end
        - follows:
            kind: comment
            not: { regex: "^#\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" }
        - inside:
            kind: decorated_definition
            follows:
              kind: comment
              not: { regex: "^#\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" }
ask: >-
  A comment in this function, or just above it, restates what the code beside it already says.
criteria:
  "true": >-
    A comment only paraphrases the statement it precedes ("increment the counter", "loop over users"), narrates the
    control flow, or marks a section that a named function would make unnecessary, and it states no reason, constraint
    or intent.
  "false": >-
    Every comment states a reason, a non-obvious constraint, a workaround, a link or an issue number, a TODO, or an
    intent the code cannot express; directives to tools (lint, type, license, build tags) and the documentation of a
    public function, class or module API are not violations.
