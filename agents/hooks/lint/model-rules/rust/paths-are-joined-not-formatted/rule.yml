# rust-style/references/filesystem.md: build paths with Path/PathBuf, not by string concatenation or formatting.
# Moved from the ast-grep rule rs_no_path_from_format, which parsed string contents with a regex. Advisory.
id: paths-are-joined-not-formatted
language: Rust
kind: noul
subject: node
state: local
# Fitted by `jev-lint eval` on this rule's own fixtures (10 cases, 5 bad and 5 clean, over 3 passes; baseline of
# 2026-11-18): the highest clean case scored 0.14 (conforming.rs:7) and the lowest violation 0.96 (violating.rs:11); the
# cutoff is jev-lint's fitted midpoint of that gap. A fit on so few cases is a starting point, not a calibration
# (ADR-0020), so the rule stays advisory.
threshold: 0.55
# Every clean case answers far below the cutoff and every bad case far above it, so this corpus cannot see the rule
# drift; boundary cases need code a reviewer would argue over.
inconclusive: >-
  Blind: the fixtures are clearly clean or clearly defective (the gap runs from 0.14 to 0.96), and no
  boundary fixture exists yet.
axis: file
severity: warning
# Over-matches on purpose: any function that builds a Path or PathBuf from a formatted or concatenated string.
rule:
  all:
    - kind: function_item
    - has:
        kind: call_expression
        stopBy: end
        regex: (?s)^(std::path::)?(PathBuf::from|Path::new)\(.*(format!|\+)
ask: >-
  This function builds a Path or PathBuf from a string that is formatted or concatenated, instead of joining path
  components.
criteria:
  "true": >-
    The string passed to `PathBuf::from` or `Path::new` is produced by `format!` or `+` and contains a path separator
    (`/` or `\`) or joins a directory and a name, where `Path::join` or `PathBuf::push` would handle the separator.
  "false": >-
    The formatted or concatenated string is a single file name or suffix with no separator (`{stem}.rs`), or the path is
    already built with `Path::join` or `PathBuf::push`. An escape sequence (`\x2e`) is not a separator, and neither is
    a `/` that only appears as an argument of a nested call whose result has none (`name.replace("/", "_")`).
