id: py_dataclass_slots
language: python
severity: error
message: "A dataclass without `slots=True` keeps a per-instance `__dict__`, which costs memory and accepts typo attributes."
note: "Change `@dataclass` to `@dataclass(slots=True)` (a class that uses `cached_property` is skipped, because it needs `__dict__`)."
rule:
  kind: decorated_definition
  all:
    - has:
        kind: class_definition
    - has:
        kind: decorator
        regex: ^@(dataclasses\.)?dataclass\b
    - not:
        has:
          kind: decorator
          regex: slots\s*=\s*True
    - not:
        has:
          kind: class_definition
          has:
            pattern: cached_property
            stopBy: end
    - not:
        all:
          - inside:
              kind: module
              stopBy: end
              has:
                pattern: from functools import cached_property as $CACHED
          - has:
              stopBy: end
              kind: decorator
              pattern: "@$CACHED"
