# bash-style: "Choose the working directory by responsibility." Advisory; the prose stays until the rule is promoted
# (ADR-0021). The matcher selects the `cd` and `pushd` commands, so this rule judges only a change into the script's own
# directory; the converse (opening bundled files by a relative path that resolves from the caller's directory) has no
# command to select and stays prose.
# The cutoff is jev-lint's fitted midpoint, 0.23: on this folder's fixtures (3 bad, 6 clean, 3 passes) the highest
# clean case scored 0.10 and the lowest bad one 0.33, a `pushd` into the script's directory that no `popd` undoes; the
# other bad cases scored 0.89 or more. Nine cases are not a calibration, so the rule stays advisory.
id: working-directory-by-responsibility
language: Bash
kind: noul
subject: node
state: located
threshold: 0.23
axis: file
severity: warning
rule:
  all:
    - kind: command
    - has: { field: name, regex: "^(cd|pushd)$" }
ask: >-
  This script changes into its own directory although some of its work operates on the target project.
criteria:
  "true": >-
    The script changes the working directory to its own location (`cd "$(dirname "$0")"`, or a `pushd` into it that no
    `popd` undoes) and then runs commands that should act on the caller's project or the current directory, as its
    comments, usage or arguments describe them.
  "false": >-
    Every command after the change works on the location it changed to, or the change is confined to a subshell or
    to a `pushd` that a `popd` undoes right after one operation, or the change goes to a directory other than the
    script's own location. A `cd` inside the command substitution that resolves the script's directory
    (`SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"`) changes nothing for the commands that follow.
