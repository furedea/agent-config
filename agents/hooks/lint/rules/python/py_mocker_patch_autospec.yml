id: py_mocker_patch_autospec
language: python
severity: error
message: "A mock without `autospec=True` accepts any call, so a wrong signature goes unnoticed."
note: "Change `mocker.patch(\"pkg.func\")` to `mocker.patch(\"pkg.func\", autospec=True)` (same for `mocker.patch.object`)."
rule:
  any:
    - pattern: mocker.patch($$$ARGS)
    - pattern: mocker.patch.object($$$ARGS)
  all:
    - not:
        has:
          kind: argument_list
          has:
            kind: keyword_argument
            regex: ^((new|new_callable|spec|spec_set|wraps)\s*=|create\s*=\s*True|autospec\s*=\s*[^F\s])
    - not:
        all:
          - pattern: mocker.patch($$$ARGS)
          - has:
              kind: argument_list
              has:
                nthChild: 2
                not:
                  kind: keyword_argument
    - not:
        all:
          - pattern: mocker.patch.object($$$ARGS)
          - has:
              kind: argument_list
              has:
                nthChild: 3
                not:
                  kind: keyword_argument
