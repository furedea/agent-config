id: tsx_no_other_test_framework
language: tsx
severity: warning
message: "Use vitest as the only test framework."
note: "The `.tsx` counterpart of ts_no_other_test_framework; ast-grep parses `.tsx` files as the separate `tsx` language. Imports of jest, mocha and `node:test`, and `jest.*` calls; a Jest dependency in `package.json` is not seen."
rule:
  any:
    - all:
        - kind: import_statement
        - has:
            field: source
            kind: string
            regex: ^["'](jest|@jest/globals|mocha|node:test)["']$
    - pattern: jest.$METHOD($$$ARGS)
