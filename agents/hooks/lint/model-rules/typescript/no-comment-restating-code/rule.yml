# M-33 minimal comments (agents/AGENTS.md: "minimize comments and docstrings; use them for public APIs, TODOs,
# non-obvious constraints, and intent that code cannot express"). Advisory: the Stop hook reports findings and never
# promotes this rule to a gate (ADR-0021). Selected by a comment inside or just before the function that is not a tool
# directive or TODO; a comment that restates the next line is the violation.
id: no-comment-restating-code
languages: [ TypeScript, Tsx ]
kind: noul
subject: node
# A comment written just before the function lies outside its node, so the whole file is sent (#196).
state: located
# The cutoff is jev-lint's fitted midpoint on this folder's fixtures (5 violations, 5 conforming cases, 3 passes,
# baseline of 2026-11-19): the highest conforming case scored 0.2 (conforming.ts:8) and the lowest violation 0.87
# (violating.ts:38, the comment before a function added for #196, which scored 0.09 to 0.10 under `state: local`). A
# fit on so few cases is not a calibration, so the rule stays advisory (ADR-0021).
threshold: 0.54
# Every clean case answers far below the cutoff and every bad case far above it, so this corpus cannot see the rule
# drift; boundary cases need code a reviewer would argue over.
inconclusive: >-
  Blind: every fixture sits 0.33 or more from the cutoff (the gap runs from 0.2 to 0.87), and no boundary fixture
  exists yet; ten cases are too few to find one.
axis: file
severity: warning
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: method_definition
        - all:
            - kind: arrow_function
            - inside: { kind: variable_declarator }
    - any:
        - has:
            kind: comment
            stopBy: end
            not: { regex: "^//\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" }
        # A comment written just before the function, or before the export or declaration that holds it.
        - follows: { kind: comment, not: { regex: "^(//|/\\*)\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" } }
        - inside: { kind: export_statement, follows: { kind: comment, not: { regex: "^(//|/\\*)\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" } } }
        - inside:
            kind: variable_declarator
            inside:
              kind: lexical_declaration
              any:
                - follows: { kind: comment, not: { regex: "^(//|/\\*)\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" } }
                - inside: { kind: export_statement, follows: { kind: comment, not: { regex: "^(//|/\\*)\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" } } }
ask: >-
  A comment in this function, or written just before it, restates what the code beside it already says.
criteria:
  "true": >-
    A comment only paraphrases the statement it precedes ("increment the counter", "loop over users"), narrates the
    control flow, or marks a section that a named function would make unnecessary, and it states no reason, constraint
    or intent. A plain comment (not a doc comment) written just before the function that only paraphrases its body
    counts too.
  "false": >-
    Every comment states a reason, a non-obvious constraint, a workaround, a link or an issue number, a TODO, or an
    intent the code cannot express; directives to tools (lint, type, license, build tags) and the doc comment of a
    public function, class or module API are not violations.
