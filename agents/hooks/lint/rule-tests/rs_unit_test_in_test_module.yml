id: rs_unit_test_in_test_module
valid:
  - |
    #[cfg(test)]
    mod tests {
        #[test]
        fn works() {}
    }
  - |
    fn helper() {}
  - |
    #[cfg(test)]
    #[allow(clippy::unwrap_used)]
    mod tests {
        #[test]
        fn works() {}
    }
  - |
    #![cfg(test)]
    #[test]
    fn works() {}
  - |
    #[cfg(all(unix, test))]
    mod tests {
        #[test]
        fn works() {}
    }
  - |
    #[cfg_attr(all(unix, test), allow(dead_code))]
    fn helper() {}
  - |
    #[cfg_attr(any(feature = "x", test), allow(dead_code))]
    fn helper() {}
  - |
    #[rstest::fixture]
    fn user() -> User { User::default() }
  - |
    #[fixture]
    fn user() -> User { User::default() }
invalid:
  - |
    #[test]
    fn works() {}
  - |
    // note
    #[test]
    #[should_panic]
    fn panics() {}
  - |
    mod internal {
        #[test]
        fn works() {}
    }
  - |
    #[tokio::test]
    async fn works() {}
  - |
    #[rstest]
    fn works() {}
  - |
    #[cfg_attr(test, test)]
    fn works() {}
  - |
    #[cfg_attr(feature = "tokio", tokio::test)]
    async fn works() {}
  - |
    #[cfg(not(test))]
    mod internal {
        #[test]
        fn works() {}
    }
  - |
    #[cfg(feature = "test")]
    mod internal {
        #[test]
        fn works() {}
    }
  - |
    #[cfg_attr(all(unix, test), test)]
    fn it_works() {}
  - |
    #[tokio::test(flavor = "multi_thread")]
    async fn it_works() {}
  - |
    #[rstest::rstest]
    fn it_works() {}
