id: py_frozen_base_model_config
language: python
severity: error
message: "`FrozenBaseModel.model_config` must set `frozen=True`, `extra=\"forbid\"`, `strict=True`, `validate_default=True` and `revalidate_instances=\"always\"`."
note: "Only a class named `FrozenBaseModel` that inherits `BaseModel` is judged. Both `ConfigDict(...)` and a dict literal are accepted."
utils:
  complete_model_config:
    kind: assignment
    all:
      - has:
          field: left
          kind: identifier
          regex: ^model_config$
      - has:
          field: right
          any:
            - kind: call
              has:
                kind: argument_list
                all:
                  - has:
                      kind: keyword_argument
                      regex: ^frozen\s*=\s*True$
                  - has:
                      kind: keyword_argument
                      regex: ^extra\s*=\s*["']forbid["']$
                  - has:
                      kind: keyword_argument
                      regex: ^strict\s*=\s*True$
                  - has:
                      kind: keyword_argument
                      regex: ^validate_default\s*=\s*True$
                  - has:
                      kind: keyword_argument
                      regex: ^revalidate_instances\s*=\s*["']always["']$
            - kind: dictionary
              all:
                  - has:
                      kind: pair
                      regex: '^["'']frozen["'']\s*:\s*True$'
                  - has:
                      kind: pair
                      regex: '^["'']extra["'']\s*:\s*["'']forbid["'']$'
                  - has:
                      kind: pair
                      regex: '^["'']strict["'']\s*:\s*True$'
                  - has:
                      kind: pair
                      regex: '^["'']validate_default["'']\s*:\s*True$'
                  - has:
                      kind: pair
                      regex: '^["'']revalidate_instances["'']\s*:\s*["'']always["'']$'
rule:
  kind: class_definition
  all:
    - has:
        field: name
        regex: ^FrozenBaseModel$
    - has:
        field: superclasses
        kind: argument_list
        has:
          any:
            - kind: identifier
              regex: ^BaseModel$
            - kind: attribute
              regex: \.BaseModel$
    - not:
        has:
          field: body
          kind: block
          has:
            kind: expression_statement
            has:
              matches: complete_model_config
