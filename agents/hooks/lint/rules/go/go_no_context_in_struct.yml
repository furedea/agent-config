id: go_no_context_in_struct
language: go
severity: warning
message: "Do not store a `context.Context` in a struct; pass it as the first parameter."
note: "Only a file that imports the standard `context` package without an alias is judged."
rule:
  kind: field_declaration
  has:
    field: type
    kind: qualified_type
    regex: ^context\.Context$
  all:
    - inside:
          kind: source_file
          has:
            kind: import_spec
            not:
              has:
                field: name
                regex: .+
            has:
              field: path
              regex: ^"context"$
            stopBy: end
          stopBy: end
