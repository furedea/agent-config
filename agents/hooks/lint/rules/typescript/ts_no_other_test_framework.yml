id: ts_no_other_test_framework
language: typescript
severity: error
message: "Importing another test framework splits the test suite across runners; this project runs vitest only."
note: "Import from vitest instead: `import { describe, it, expect, vi } from \"vitest\"`, and use `vi.fn()` where `jest.fn()` was used."
rule:
  any:
    - all:
        - kind: import_statement
        - has:
            field: source
            kind: string
            regex: ^["'](jest|@jest/globals|mocha|node:test|bun:test|ava|tap|tape|jasmine|uvu|qunit)["']$
    - all:
        - pattern: jest.$METHOD($$$ARGS)
        - not:
            inside:
              stopBy: end
              all:
                - any:
                    - kind: function_declaration
                    - kind: generator_function_declaration
                    - kind: generator_function
                    - kind: function_expression
                    - kind: arrow_function
                    - kind: method_definition
                - any:
                    - has:
                        field: parameters
                        has:
                          stopBy: end
                          kind: identifier
                          regex: ^jest$
                          inside:
                            field: pattern
                            any:
                              - kind: required_parameter
                              - kind: optional_parameter
                    - has:
                        field: parameter
                        kind: identifier
                        regex: ^jest$
        - not:
            inside:
              stopBy: end
              kind: catch_clause
              has: { field: parameter, kind: identifier, regex: ^jest$ }
        - not:
            inside:
              stopBy: end
              any:
                - kind: program
                - kind: statement_block
              has:
                any:
                  - kind: lexical_declaration
                  - kind: variable_declaration
                has:
                  kind: variable_declarator
                  has: { field: name, kind: identifier, regex: ^jest$ }
        - not:
            inside:
              stopBy: end
              kind: program
              has:
                kind: import_statement
                has:
                  kind: import_clause
                  has:
                    stopBy: end
                    kind: identifier
                    regex: ^jest$
    - all:
        - kind: export_statement
        - has:
            field: source
            kind: string
            regex: ^["'](jest|@jest/globals|mocha|node:test|bun:test|ava|tap|tape|jasmine|uvu|qunit)["']$
    - all:
        - kind: call_expression
        - has: { field: function, regex: ^(import|require)$ }
        - has:
            field: arguments
            regex: ^\(["'](jest|@jest/globals|mocha|node:test|bun:test|ava|tap|tape|jasmine|uvu|qunit)["']\)$
