# Time and randomness are arguments, not read inside logic (agents/skills/typescript-style/references/testing.md).
# Advisory and unfitted.
id: inject-time-and-randomness
languages: [ TypeScript, Tsx ]
kind: noul
subject: node
# The whole file: a bare `randomInt(..)` is the crypto API only when the file imports it from there (#196).
state: located
threshold: 0.5
axis: file
severity: warning
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: generator_function_declaration
        - kind: method_definition
        - all:
            - any:
                - kind: arrow_function
                - kind: function_expression
                - kind: generator_function
    - has:
        stopBy: { any: [ { kind: generator_function_declaration }, { kind: generator_function }, { kind: function_declaration }, { kind: function_expression }, { kind: arrow_function }, { kind: method_definition } ] }
        any:
          - pattern: Date.now()
          - pattern: Date()
          - pattern: new Date()
          - pattern: new Date
          - pattern: Math.random()
          - pattern: $OBJ.randomUUID()
          - pattern: randomUUID()
          - pattern: $OBJ.randomInt($$$ARGS)
          - pattern: randomInt($$$ARGS)
          - pattern: $OBJ.randomBytes($$$ARGS)
          - pattern: randomBytes($$$ARGS)
          - pattern: $OBJ.randomFillSync($$$ARGS)
          - pattern: randomFillSync($$$ARGS)
          - pattern: $OBJ.getRandomValues($$$ARGS)
          - pattern: getRandomValues($$$ARGS)
ask: >-
  This function reads the current time or a random value itself, so its result cannot be fixed in a test.
criteria:
  "true": >-
    Logic that computes a result calls `Date.now()`, `new Date()`, `Math.random()` or a Node/Web crypto random API (`randomUUID`, `randomInt`,
    `randomBytes`, `getRandomValues`) directly instead
    of receiving the time or a random function (for example an `Rng`) as an argument or a dependency.
  "false": >-
    The function is a thin entry point or composition root that supplies the clock or random source to the logic, or it only
    measures elapsed time for logging, or it already receives them as arguments. A call named like a random API that
    the file does not import from `node:crypto` or the Web Crypto API (a project helper or an injected `rng`) is not a
    violation.
