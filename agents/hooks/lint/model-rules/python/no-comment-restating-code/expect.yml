  - { line: 29, label: clean, window: 1, why: "states why the conversion exists" }
  - { line: 34, label: clean, window: 1, why: "states the constraint behind the backoff" }
  - { line: 44, label: clean, window: 1, why: "a workaround with its upstream issue" }
  - { line: 50, label: clean, window: 1, why: "states why the sort is two-pass" }
  - { line: 55, label: clean, window: 1, why: "a docstring of a public function" }
