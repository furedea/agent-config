id: ts_catch_rethrow_requires_cause
language: typescript
severity: error
message: "A new Error thrown inside a catch without `cause` hides the original error and its stack."
note: "Write `throw new Error(\"read config\", { cause: error })` instead of `throw new Error(\"read config\")`."
rule:
  all:
    - pattern: new $ERROR($$$ARGS)
    - inside:
        kind: throw_statement
        inside:
          any:
            - kind: catch_clause
              has: { field: parameter, kind: identifier, pattern: $CAUGHT }
            - all:
                - any:
                    - kind: arrow_function
                    - kind: function_expression
                - any:
                    - has: { field: parameter, kind: identifier, pattern: $CAUGHT }
                    - has:
                        field: parameters
                        has:
                          kind: required_parameter
                          has: { field: pattern, kind: identifier, pattern: $CAUGHT }
                - inside:
                    kind: arguments
                    inside:
                      kind: call_expression
                      has: { field: function, kind: member_expression, regex: '\.catch$' }
          stopBy:
            any:
              - kind: function_declaration
              - kind: generator_function_declaration
              - kind: generator_function
              - kind: function_expression
              - kind: arrow_function
              - kind: method_definition
    - not:
        has:
          pattern: $CAUGHT
          stopBy: end
          any:
            - kind: identifier
            - kind: shorthand_property_identifier
    - not:
        has:
          kind: arguments
          has:
            any:
              - kind: identifier
              - kind: member_expression
              - kind: call_expression
              - kind: subscript_expression
              - kind: spread_element
              - kind: await_expression
              - kind: ternary_expression
              - kind: as_expression
              - kind: non_null_expression
              - kind: parenthesized_expression
    - not:
        has: { kind: spread_element, stopBy: end }
    - not:
        has:
          stopBy: end
          any:
            - all:
                - kind: pair
                - has: { field: key, regex: '^cause$' }
            - all:
                - kind: shorthand_property_identifier
                - regex: '^cause$'
constraints:
  ERROR: { regex: Error$ }
