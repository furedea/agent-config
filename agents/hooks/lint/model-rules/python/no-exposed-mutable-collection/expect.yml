  - { line: 19, label: clean, window: 1, why: "returns a scalar field" }
  - { line: 33, label: bad, window: 1, why: "a property returns the internal set" }
  - { line: 46, label: bad, window: 1, why: "returns the internal header dict" }
  - { line: 56, label: clean, window: 1, why: "the field is a tuple" }
  - { line: 69, label: clean, window: 1, why: "returns a copy" }
  - { line: 72, label: clean, window: 1, why: "returns one element, not the collection" }
  - { line: 80, label: clean, window: 1, why: "a plain record with no invariants" }
