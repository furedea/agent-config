default: clean
# Lines are the t.Skip call. violating_test.go: a skip for a known defect with no removal condition.
# conforming_test.go: a condition in a comment or in the message, and skips that are not for a defect; the last four
# are boundary cases that look like a violation (a toolchain gap with a version in the message, a comment that names
# the release that carries the fix, a dependency version bump as the condition, an external issue being closed).
fixtures/violating_test.go:
  - { line: 6, label: bad, window: 1 }
  - { line: 10, label: bad, window: 1 }
  - { line: 14, label: bad, window: 1 }
  - { line: 19, label: bad, window: 1 }
  - { line: 24, label: bad, window: 1 }
  - { line: 28, label: bad, window: 1 }
  - { line: 32, label: bad, window: 1 }
  - { line: 37, label: bad, window: 1 }
fixtures/conforming_test.go:
  - { line: 11, label: clean, window: 1 }
  - { line: 15, label: clean, window: 1 }
  - { line: 20, label: clean, window: 1 }
  - { line: 26, label: clean, window: 1 }
  - { line: 31, label: clean, window: 1 }
  - { line: 36, label: clean, window: 1 }
  - { line: 41, label: clean, window: 1, why: "boundary: skipped for a missing toolchain feature, not a defect; the message names the version it needs" }
  - { line: 47, label: clean, window: 1, why: "boundary: a known defect whose comment names the release that carries the fix" }
  - { line: 52, label: clean, window: 1, why: "boundary: the removal condition is a dependency version bump named in the comment, not a code change" }
  - { line: 56, label: clean, window: 1, why: "boundary: the removal condition is an external issue being closed, named in the message" }
