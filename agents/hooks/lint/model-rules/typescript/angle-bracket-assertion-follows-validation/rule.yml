# The angle-bracket form `<T>value` of the same rule; it does not exist in Tsx, so this rule is TypeScript only.
# `as` is used only immediately after validation (agents/skills/typescript-style/references/types.md). Advisory and unfitted.
id: angle-bracket-assertion-follows-validation
language: TypeScript
kind: noul
subject: node
state: local
threshold: 0.5
axis: file
severity: warning
rule:
  kind: type_assertion
ask: >-
  This angle-bracket type assertion is not placed immediately after a check that makes it true.
criteria:
  "true": >-
    The asserted value was not validated by code just above it (a type guard, a parse function, a schema check, or an
    exhaustive test), so the assertion only silences the compiler, as in a cast of a parsed JSON value, an `any`, or an
    argument whose shape was never tested.
  "false": >-
    The assertion directly follows the check that justifies it, as the final step of a validating parse function that
    creates a branded type, or it is `as unknown` or a widening that cannot be wrong.
