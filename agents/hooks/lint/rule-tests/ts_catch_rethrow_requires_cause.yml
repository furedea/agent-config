id: ts_catch_rethrow_requires_cause
valid:
  - |
    try {
      run();
    } catch (error) {
      throw new Error("read config", { cause: error });
    }
  - |
    try {
      run();
    } catch (error) {
      throw error;
    }
  - |
    try {
      run();
    } catch (error) {
      throw new AppError({ message: "read config", cause: error });
    }
  - |
    try {
      run();
    } catch (error) {
      throw new WrappedError(error);
    }
  - |
    try {
      run();
    } catch (error) {
      const cause = error instanceof Error ? error : new Error(String(error));
      throw new Error("read config", { cause });
    }
  - |
    try {
      run();
    } catch (error) {
      const wrapped = toError(error);
      throw new XError("read config", { cause: wrapped });
    }
  - |
    try {
      run();
    } catch (error) {
      throw new AppError({ message: "read config", error });
    }
  - |
    try {
      run();
    } catch (error) {
      throw new Error(`read config: ${error}`);
    }
  - |
    try {
      run();
    } catch (error) {
      throw new XError("read config", { ...options });
    }
  - |
    request().catch((error) => {
      throw new WrappedError(error);
    });
  - |
    request().catch(function (error) {
      throw new AppError({ cause: error });
    });
  - |
    request().catch(error => {
      throw new WrappedError(error);
    });
  - |
    request().catch((error) => {
      throw new Error("request failed", { cause: error });
    });
  - |
    request().catch(() => {
      throw new Error("request failed");
    });
  - |
    request().then((value) => {
      throw new Error("bad value");
    });
  - |
    try {
      run();
    } catch {
      throw new Error("read config");
    }
  - |
    function validate(value: string): void {
      throw new Error("value is empty");
    }
  - |
    try {
      run();
    } catch (error) {
      throw new Error("read config", options);
    }
  - |
    try {
      run();
    } catch (error) {
      function* parse() {
        throw new Error("bad token");
      }
      const gen = function* () {
        throw new Error("bad token");
      };
    }
invalid:
  - |
    try {
      run();
    } catch (error) {
      throw new Error("read config");
    }
  - |
    request().catch((error) => {
      throw new Error("request failed");
    });
  - |
    request().catch(function (error) {
      throw new TypeError("request failed");
    });
  - |
    try {
      run();
    } catch (error) {
      throw new XError("read config");
    }
  - |
    try {
      run();
    } catch (error) {
      throw new AppError({ message: "read config" });
    }
  - |
    request().catch(error => {
      throw new Error("request failed");
    });
  - |
    try {
      run();
    } catch (error) {
      throw new Error("read config", {});
    }
  - |
    try {
      run();
    } catch (error) {
      throw new Error("read config", { retries: 1 });
    }
  - |
    try {
      run();
    } catch (error) {
      if (retried) {
        throw new TypeError(`read ${path}`);
      }
    }
