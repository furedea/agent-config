# M-31 separate construction from execution (agents/AGENTS.md: "separate object creation/configuration from execution
# logic"). Advisory: the Stop hook reports findings and never promotes this rule to a gate (ADR-0021). Only functions
# that construct a collaborator (a name ending in Client, Service, Repository, Connection and the like) are asked
# about, to spare the shared Stop subject budget; errors, standard collections and value objects are not selected.
id: construction-separate-from-execution
language: Rust
divergent: >-
  Fitted on Rust fixtures (#220), the criteria name the composition root that hands control to one call such as
  `app.run()`, which the Rust model otherwise flagged.
kind: noul
subject: node
state: local
# Fitted by `jev-lint eval` on this rule's own fixtures (10 cases, 5 bad and 5 clean, over 3 passes; baseline of
# 2026-11-18): the highest clean case scored 0.36 (conforming.rs:20) and the lowest violation 0.88 (violating.rs:55);
# the cutoff is jev-lint's fitted midpoint of that gap. Before the criteria named the composition root, conforming.rs:13
# scored 0.89. A fit on so few cases is a starting point, not a calibration (ADR-0020), so the rule stays advisory.
threshold: 0.62
# Every clean case answers far below the cutoff and every bad case far above it, so this corpus cannot see the rule
# drift; boundary cases need code a reviewer would argue over.
inconclusive: >-
  Blind: the fixtures are clearly clean or clearly defective (the gap runs from 0.36 to 0.88), and no
  boundary fixture exists yet.
axis: file
severity: warning
rule:
  all:
    - kind: function_item
    - any:
        # `ApiClient::new(..)`, `ApiClient<T>::new(..)` and the turbofish `ApiClient::<T>::new(..)`
        - has:
            kind: call_expression
            stopBy: end
            regex: "^([A-Za-z_][A-Za-z0-9_]*::)*[A-Za-z0-9_]*(Client|Service|Repository|Connection|Session|Parser|Engine|Manager|Adapter|Gateway|Store|Factory|Handler|Loader|Reader|Writer|Server|Pool|Provider|Runner)((::)?<[^>]*>)?::(new|builder|default|from|with_\\w+)\\("
        # A struct literal: `ApiClient { endpoint, token }`
        - has:
            kind: struct_expression
            stopBy: end
            has:
              field: name
              regex: "(Client|Service|Repository|Connection|Session|Parser|Engine|Manager|Adapter|Gateway|Store|Factory|Handler|Loader|Reader|Writer|Server|Pool|Provider|Runner)$"
ask: >-
  This function creates and configures its own collaborators and then also runs the logic that uses them.
criteria:
  "true": >-
    The body constructs a service, client, connection, repository, parser or similar collaborator, configures it
    (options, credentials, wiring), and then itself performs the business logic with it: it loops, branches, filters
    or calculates over what the collaborator returns, so that testing that logic requires building the collaborator
    inside this function.
  "false": >-
    The collaborator is passed in; or the function only constructs and returns it (a factory, a builder, a `new`); or
    it is a composition root that wires collaborators together and hands control to one call such as `app.run()`,
    doing no business logic of its own. Creating plain data, value objects, local collections or a short-lived helper
    over in-memory data is not a violation.
