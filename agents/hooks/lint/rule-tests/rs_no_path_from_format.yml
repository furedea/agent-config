id: rs_no_path_from_format
valid:
  - |
    fn f(dir: &Path) -> PathBuf { dir.join("a") }
  - |
    fn f(name: &str) -> PathBuf { PathBuf::from(name) }
  - |
    fn f(name: &str) -> String { format!("{name}.txt") }
  - |
    fn f(stem: &str) -> PathBuf { PathBuf::from(format!("{stem}.rs")) }
  - |
    fn f(stem: String) -> PathBuf { PathBuf::from(stem + ".rs") }
  - |
    fn f(name: &str) { let p = Path::new(&format!("{name}.json")); }
  - |
    fn f(name: &str) -> PathBuf { PathBuf::from(format!("{}", name.replace("/", "_"))) }
  - |
    fn f(name: &str) -> PathBuf { PathBuf::from(name.replace("/", "_") + ".rs") }
  - |
    fn f(name: &str) { let p = Path::new(&format!("{}", name.replace('/', "_"))); }
invalid:
  - |
    fn f(dir: &str) -> PathBuf { PathBuf::from(format!("{dir}/a")) }
  - |
    fn f(dir: &str) { let p = Path::new(&format!("{}/a", dir)); }
  - |
    fn f(dir: String) { let p = Path::new(&(dir + "/a")); }
  - |
    fn f(root: &str) -> PathBuf { std::path::PathBuf::from(format!("{root}/child")) }
  - |
    fn f(root: String) -> PathBuf { PathBuf::from(root + "/child") }
  - |
    fn f(dir: &str, name: &str) -> PathBuf { PathBuf::from(format!("{dir}/{name}.rs")) }
  - |
    fn f(dir: &str) -> PathBuf { PathBuf::from(format!(r#"{dir}/child"#)) }
  - |
    fn f(dir: &str) { let p = Path::new(&format!(r"{dir}\child")); }
  - |
    fn f(dir: &str, name: &str) -> PathBuf { PathBuf::from(dir.to_owned() + "/" + name) }
  - |
    fn f(dir: &str) -> PathBuf { PathBuf::from(format!("{}/a", dir.replace("-", "_"))) }
