id: ts_readonly_array_property
language: typescript
severity: warning
message: "Declare the array property as `readonly T[]`."
note: "Only an array that is the whole type of a property in a `type` or `interface` is reported; arrays in parameters and returns are left alone."
rule:
  all:
    - any:
        - kind: array_type
        - all:
            - kind: generic_type
            - has: { field: name, regex: ^Array$ }
    - inside:
        kind: type_annotation
        stopBy:
          not:
            kind: union_type
        inside:
          kind: property_signature
          inside:
            any:
              - kind: interface_body
              - all:
                  - kind: object_type
                  - inside:
                      kind: type_alias_declaration
                      stopBy:
                        not:
                          any:
                            - kind: union_type
                            - kind: intersection_type
                            - kind: parenthesized_type
