id: py_no_vague_file_name
language: python
severity: warning
message: "Name the file by its domain or action, not a vague word like utils, helpers, manager, common, or formatter, unless the name is already established locally."
rule:
  kind: module
files:
  - "**/{utils,util,helpers,helper,manager,common,formatter}.py"
  - "**/*[._-]{utils,util,helpers,helper,manager,common,formatter}.py"
  - "**/{utils,util,helpers,helper,manager,common,formatter}[._-]*.py"
  - "**/*[._-]{utils,util,helpers,helper,manager,common,formatter}[._-]*.py"
ignores:
  - "**/__*__.py"
