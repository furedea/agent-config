# rust-style/references/filesystem.md: build paths with Path/PathBuf, do not follow symlinks while traversing unless
# required and tested, use DirEntry::file_type() where symlink behaviour matters, and write through a temporary file
# when a partial write would be harmful. Advisory and not fitted.
id: filesystem-code-keeps-paths-and-symlinks-safe
language: Rust
kind: noul
subject: node
state: local
threshold: 0.5
axis: file
severity: warning
# Calls that traverse, test a path's kind, or replace file content; a plain read is not selected here.
rule:
  all:
    - kind: function_item
    - has:
        kind: call_expression
        stopBy: end
        regex: (read_dir|WalkDir|\.is_dir\(|\.is_file\(|\.exists\(|symlink|fs::(write|rename|copy|remove_[a-z_]+)\(|File::create)
ask: >-
  This function traverses a directory, branches on a path's kind, or replaces a file in a way that mishandles symlinks
  or partial writes.
criteria:
  "true": >-
    Any one of these holds. It follows symlinks while walking a source tree without a stated and tested need. It
    recurses or skips on `Path::is_dir`, `is_file` or `exists` while walking a tree, where a symlink would lead it out
    of the tree or into a loop (instead of `DirEntry::file_type()`). It builds a path by string concatenation or
    formatting. It overwrites in place a file that must stay readable, such as a lockfile, a settings file or user
    data, so that a partial write would leave it unusable (instead of writing a temporary file and replacing the
    target).
  "false": >-
    Traversal reads `DirEntry::file_type()` and does not follow symlinks; a single kind check on one known path that
    is not part of a traversal (`dir.join("Cargo.toml").is_file()`, `exists()` before `create_dir_all`), where a
    symlink to the right kind of file is as good as the file; creating a symlink on purpose; and a write whose partial
    result is harmless, such as a cache regenerated when it cannot be read, or one that goes through a temporary file.
