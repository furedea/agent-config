id: rs_no_follow_links
language: rust
severity: error
message: "Following symlinks while walking a source tree can loop forever or leave the tree."
note: "Remove `.follow_links(true)` (the default is `false`), or write `.follow_links(false)`."
rule:
  pattern: $WALK.follow_links(true)
  has:
    stopBy: end
    any:
      - pattern: WalkDir::new($$$ARGS)
      - pattern: walkdir::WalkDir::new($$$ARGS)
      - pattern: WalkBuilder::new($$$ARGS)
      - pattern: ignore::WalkBuilder::new($$$ARGS)
