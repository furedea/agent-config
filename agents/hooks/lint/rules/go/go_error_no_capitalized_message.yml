id: go_error_no_capitalized_message
language: go
severity: warning
message: "Start the error message with a lowercase letter."
note: "A message that starts with an initialism (`HTTP 500`) is skipped: only a capital followed by a lowercase letter or a space matches. Only a file that imports `fmt` or `errors` without an alias is judged, and a function whose parameter is named `fmt` or `errors` is skipped."
rule:
  any:
    - pattern: fmt.Errorf($MSG, $$$ARGS)
    - pattern:
        context: "func f() { fmt.Errorf($MSG) }"
        selector: call_expression
    - pattern:
        context: "func f() { errors.New($MSG) }"
        selector: call_expression
  all:
    - inside:
        kind: source_file
        has:
          kind: import_spec
          not:
            has:
              field: name
              regex: .+
          has:
            field: path
            regex: ^"(fmt|errors)"$
          stopBy: end
        stopBy: end
    - not:
        inside:
          any:
            - kind: function_declaration
            - kind: method_declaration
            - kind: func_literal
          has:
            field: parameters
            has:
              kind: parameter_declaration
              has:
                field: name
                regex: ^(fmt|errors)$
              stopBy: end
          stopBy: end
constraints:
  MSG:
    regex: ^["`][A-Z]([a-z]|\s)
