  - { line: 5, label: bad, window: 1 }
  - { line: 21, label: bad, window: 1 }
  - { line: 37, label: bad, window: 1 }
  - { line: 52, label: bad, window: 1 }
  - { line: 64, label: bad, window: 1 }
  - { line: 66, label: bad, window: 1 }
fixtures/conforming.rs:
