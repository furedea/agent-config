id: go_use_slog
language: go
severity: warning
message: "Log with `log/slog` instead of the standard `log` package."
note: "Test files are skipped. A `*log.Logger` held in a variable or built by `log.New` is not followed; an aliased import is not either. Only a file that imports the standard `log` package is judged."
ignores:
  - "**/*_test.go"
rule:
  kind: call_expression
  regex: ^log\.(Default\(\)\.)?(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Output)\(
  inside:
    kind: source_file
    has:
      kind: import_spec
      has:
        field: path
        regex: ^"log"$
      stopBy: end
    stopBy: end
