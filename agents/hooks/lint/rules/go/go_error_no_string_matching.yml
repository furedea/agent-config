id: go_error_no_string_matching
# Limits: Test files are skipped because tests may assert the exact message of an error they create.
language: go
severity: error
message: "Matching an error's text breaks silently when the message is reworded and ignores wrapped errors."
note: "Use `errors.Is(err, ErrNotFound)` or `errors.As(err, &target)` instead of `err.Error() == \"not found\"`."
ignores:
  - "**/*_test.go"
rule:
  any:
    - pattern: $ERR.Error() == $TEXT
    - pattern: $ERR.Error() != $TEXT
    - pattern: strings.Contains($ERR.Error(), $TEXT)
    - pattern: strings.HasPrefix($ERR.Error(), $TEXT)
    - pattern: strings.HasSuffix($ERR.Error(), $TEXT)
    - pattern: strings.EqualFold($ERR.Error(), $TEXT)
    - pattern: $TEXT == $ERR.Error()
    - pattern: $TEXT != $ERR.Error()
