# M-34 collection objects (agents/AGENTS.md: "do not expose mutable raw collections"). Advisory (ADR-0021). Selected
# by a function that returns a field or a mutable reference; the criteria require the collection to be an unexported
# field that the type keeps behind its methods. The first criteria scored an exported field of a JSON record 0.84
# against 0.87 for the lowest bad case; the criteria now exclude plain data structs. The cutoff 0.57 is jev-lint's
# fitted midpoint on this folder's fixtures (eval of 2026-11-18, 3 passes, after the criteria rewrite): the highest
# clean case scored 0.22 and the lowest bad one 0.92.
id: no-exposed-mutable-collection
language: Go
kind: noul
subject: node
state: local
threshold: 0.57
# The fixtures sit far from the cutoff on both sides, so replay calls the suite blind; a boundary fixture would
# need a case a reviewer would argue over.
inconclusive: >-
  Blind: every fixture is clearly clean or clearly defective and no boundary case exists yet; the next one to
  add is a getter on a type whose only invariant is set by its constructor.
axis: file
severity: warning
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: method_declaration
    # A result that is a slice or map, alone or among several results, or a type this file declares as one.
    - any:
        - has:
            field: result
            regex: "\\[\\]|map\\["
        - all:
            - has: { field: result, pattern: $TYPE }
            - inside:
                kind: source_file
                has:
                  kind: type_spec
                  stopBy: end
                  all:
                    - has: { field: name, pattern: $TYPE }
                    - has: { field: type, regex: "^(\\[\\]|map\\[)" }
    - has: { pattern: return $R.$F, stopBy: end }
ask: >-
  This function hands the caller an object's own private mutable collection, so the caller can change that object's
  state without going through its methods.
criteria:
  "true": >-
    The function returns a slice, map or other mutable collection that is an unexported field of the receiver or of a
    long-lived object it holds, or a sub-slice of one, as the same backing storage, while that type otherwise keeps the
    collection behind its methods.
  "false": >-
    The returned collection is a copy or a clone; or a value the function built itself, including a field of a local
    value it has just built; or an exported field of a plain data struct (a DTO, a JSON record) that the caller can
    already reach directly, so returning it exposes nothing new. Returning a collection from a type that has no
    invariants is not a violation.
