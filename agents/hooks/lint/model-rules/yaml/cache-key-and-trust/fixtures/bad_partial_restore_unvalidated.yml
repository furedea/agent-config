name: Lint
on: pull_request
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-venv-
      # The restored environment is used as is: nothing reinstalls or syncs it with the lock file.
      - run: .venv/bin/ruff check .
      - run: .venv/bin/pytest
