# Fakes over mocks; vi.mock only for external dependencies at module boundaries
# (agents/skills/typescript-style/references/testing.md). Advisory.
id: mock-only-external-boundaries
languages: [ TypeScript, Tsx ]
kind: noul
subject: node
# The whole file: whether a spied object or mocked module is external shows in the imports and the setup (#196).
state: located
# The cutoff is jev-lint's fitted midpoint on this folder's fixtures (4 violations, 4 conforming cases, 3 passes,
# means, #220): the highest conforming case scored 0.34 (0.35 in its worst pass) and the lowest violation 0.84 (0.83
# in its worst pass). A fit on so few cases is not a calibration, so the rule stays advisory (ADR-0021).
threshold: 0.59
inconclusive: >-
  Blind: every fixture is clearly clean or clearly defective (margins of 0.25 or more from the cutoff), and no
  boundary fixture exists yet; eight cases are too few to find one.
axis: file
severity: warning
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        kind: member_expression
        regex: '^vi\.(mock|doMock|spyOn)$'
ask: >-
  This test mocks or spies on code that the project owns, or on something that is not a dependency at a module boundary,
  where a simple fake implementation passed in would do.
criteria:
  "true": >-
    The mocked module or spied method belongs to the project itself (a sibling module or an internal collaborator), or the
    test replaces behaviour it could inject as a fake object.
  "false": >-
    The mock replaces an external dependency at its module boundary, such as a network client, the file system, a clock, or
    a third-party package, and no fake can be injected there.
