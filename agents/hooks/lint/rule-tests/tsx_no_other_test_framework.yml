id: tsx_no_other_test_framework
valid:
  - |
    import { expect, it } from "vitest";
  - |
    import { readFile } from "node:fs/promises";
  - |
    vi.fn();
  - |
    export { it } from "vitest";
  - |
    const { it } = await import("vitest");
  - |
    const path = require("node:path");
  - |
    function render(jest: DomainFormatter) {
      return jest.format();
    }
  - |
    const render = (jest) => jest.format();
  - |
    class View {
      render(jest: Formatter = defaultFormatter) {
        return jest.format();
      }
    }
  - |
    function render() {
      const jest = makeFormatter();
      return jest.format();
    }
  - |
    const jest = makeFormatter();
    function render() {
      return jest.format();
    }
  - |
    import jest from "./domain_formatter";
    jest.format();
  - |
    import { jest } from "./domain_formatter";
    jest.format();
  - |
    import * as jest from "./domain_formatter";
    jest.format();
  - |
    try {
      run();
    } catch (jest) {
      if (isFormatter(jest)) jest.format();
    }
invalid:
  - |
    const mock = jest.fn();
    function render() {
      const jest = makeFormatter();
      return jest.format();
    }
  - |
    import { describe, it } from "node:test";
  - |
    import { jest } from "@jest/globals";
  - |
    const spy = jest.fn();
  - |
    import { test } from "bun:test";
  - |
    import test from "ava";
  - |
    export { test } from "node:test";
  - |
    export * from "mocha";
  - |
    const { test } = await import("node:test");
  - |
    const jest = require("jest");
