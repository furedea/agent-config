id: rs_unit_test_in_test_module
language: rust
severity: warning
message: "Put a unit test in `#[cfg(test)] mod tests`, or move it to `tests/` when it exercises the public API."
files:
  - "**/src/**/*.rs"
ignores:
  - "**/*tests.rs"
  - "**/fixtures.rs"
  - "**/tests/**"
  - "**/test_support.rs"
  - "**/build.rs"
  - "**/fixtures/**"
rule:
  all:
    - kind: function_item
    - follows:
        kind: attribute_item
        regex: ^#\[test\]
        stopBy:
          not:
            any:
              - kind: attribute_item
              - kind: line_comment
    - not:
        inside:
          kind: mod_item
          stopBy: end
