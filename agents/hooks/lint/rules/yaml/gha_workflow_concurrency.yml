id: gha_workflow_concurrency
language: yaml
severity: error
message: "Without `concurrency`, every push to the same ref keeps running superseded workflow runs."
note: "Add `concurrency: { group: ${{ github.workflow }}-${{ github.ref }}, cancel-in-progress: true }` at the top level (`cancel-in-progress: false` for a deploy that must run in order)."
files:
  - "**/.github/workflows/**"
# Scope: Only workflows triggered by `push` or `pull_request` are checked. The value of `cancel-in-progress` is not judged, because a deploy workflow that must run in order sets it to false, and a workflow that is only called or dispatched has no burst of runs per ref.
rule:
  kind: block_mapping
  inside:
    kind: block_node
    inside:
      kind: document
  has:
    kind: block_mapping_pair
    all:
      - has:
          field: key
          regex: ^["']?on["']?$
      - has:
          field: value
          any:
            - regex: ^["']?(push|pull_request)["']?$
            - regex: ^\[[^\]]*\b(push|pull_request)\b
            - has:
                any:
                  - kind: block_mapping
                  - kind: flow_mapping
                has:
                  any:
                    - kind: block_mapping_pair
                    - kind: flow_pair
                  has:
                    field: key
                    regex: ^["']?(push|pull_request)["']?$
  not:
    has:
      kind: block_mapping_pair
      all:
        - has:
            field: key
            regex: ^["']?concurrency["']?$
        - has:
            field: value
            has:
              stopBy: end
              any:
                - kind: block_mapping_pair
                - kind: flow_pair
              has:
                field: key
                regex: ^cancel-in-progress$
