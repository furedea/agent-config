id: py_dataclass_slots
valid:
  - |
    @dataclass(frozen=True, slots=True)
    class Age:
        value: int
  - |
    @dataclasses.dataclass(slots=True)
    class Capture:
        total: int
  - |
    @dataclass(frozen=True)
    class Report:
        rows: tuple[int, ...]

        @cached_property
        def total(self) -> int:
            return sum(self.rows)
  - |
    @functools.total_ordering
    class Age:
        value: int
invalid:
  - |
    @dataclass
    class Age:
        value: int
  - |
    @dataclass(frozen=True)
    class Age:
        value: int
  - |
    @dataclasses.dataclass(frozen=True)
    class Age:
        value: int
  - |
    @dataclass(slots=False)
    class Capture:
        total: int
