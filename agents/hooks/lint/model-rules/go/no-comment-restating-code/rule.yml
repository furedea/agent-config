# M-33 minimal comments (agents/AGENTS.md: "minimize comments and docstrings; use them for public APIs, TODOs,
# non-obvious constraints, and intent that code cannot express"). Advisory (ADR-0021). Selected by a comment inside
# the function that is not a tool directive or TODO; a comment that restates the next line is the violation. The
# cutoff 0.54 is jev-lint's fitted midpoint on this folder's fixtures (eval of 2026-11-18, 3 passes): the highest
# clean case scored 0.12 and the lowest bad one 0.97.
id: no-comment-restating-code
language: Go
kind: noul
subject: node
state: local
threshold: 0.54
# The fixtures sit far from the cutoff on both sides (highest clean and lowest bad: 0.12 and 0.97), so replay
# calls the suite blind; a boundary fixture would need a case a reviewer would argue over.
inconclusive: >-
  Blind: every fixture is clearly clean or clearly defective and no boundary case exists yet; the next one to
  add is a comment that restates the line but adds a unit or a reason in a few words.
axis: file
severity: warning
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: method_declaration
    - any:
        - has:
            kind: comment
            stopBy: end
            not: { regex: "^//\\s*(TODO|FIXME|XXX|HACK|SAFETY|noqa|type:|pragma|pylint|ruff|nosec|nolint|clippy|rustfmt|eslint|oxlint|ts-|prettier|biome|@ts|go:|#!)" }
ask: >-
  A comment in this function restates what the code beside it already says.
criteria:
  "true": >-
    A comment only paraphrases the statement it precedes ("increment the counter", "loop over users"), narrates the
    control flow, or marks a section that a named function would make unnecessary, and it states no reason, constraint
    or intent.
  "false": >-
    Every comment states a reason, a non-obvious constraint, a workaround, a link or an issue number, a TODO, or an
    intent the code cannot express; directives to tools (lint, type, license, build tags) and the documentation of a
    public function, class or module API are not violations.
