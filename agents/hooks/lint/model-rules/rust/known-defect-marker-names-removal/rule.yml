# M-60 a known-defect marker carries a comment naming the condition for removing it
# (agents/skills/python-style/references/testing.md, which states it for xfail). Rust has no expected-failure marker,
# so a test ignored for a known defect is the marker here; see go/known-defect-marker-names-removal. Advisory.
id: known-defect-marker-names-removal
language: Rust
divergent: Rust has no xfail; the marker is #[ignore], and an ignore for another reason is not a violation.
kind: noul
subject: node
# The comment sits above the attribute, outside the attribute, so the arm that sends the file is used.
state: located
# Fitted by `jev-lint eval` on this rule's own fixtures (11 cases, 6 bad and 5 clean, over 3 passes; baseline of
# 2026-11-18): the highest clean case scored 0.16 (conforming.rs:3) and the lowest violation 0.58 (violating.rs:33); the
# cutoff is jev-lint's fitted midpoint of that gap. A fit on so few cases is a starting point, not a calibration
# (ADR-0020), so the rule stays advisory.
threshold: 0.37
axis: file
severity: warning
rule:
  all:
    - kind: attribute_item
    # Also an ignore attached conditionally: `#[cfg_attr(target_os = "windows", ignore = "...")]`, matched on the
    # attribute nodes. `cfg_attr`'s arguments are one flat token list in which the condition is nested or ends at the
    # first comma, so an `ignore` that directly follows a comma is in the attribute list; `cfg_attr(ignore, ..)`,
    # `cfg_attr(feature = "ignore", ..)` and `cfg_attr(any(unix, ignore = ".."), ..)` attach no ignore.
    - has:
        kind: attribute
        any:
          - regex: ^ignore\b
          - all:
              - has: { kind: identifier, regex: ^cfg_attr$ }
              - has:
                  field: arguments
                  kind: token_tree
                  has:
                    kind: identifier
                    regex: ^ignore$
                    follows: { regex: "^,$", stopBy: neighbor }
ask: >-
  This test is ignored because of a known defect, without a reason or comment that names the condition under which
  the marker is removed.
criteria:
  "true": >-
    The test is ignored for a known defect, and neither the attribute's reason nor a comment next to it names a
    condition such as a fixed defect, a released dependency version, or a finished feature; the marker is bare or only
    says that the test is broken or to fix it later.
  "false": >-
    The test is not ignored for a known defect (for example it is slow or needs a credential), or the attribute's reason
    or a comment next to it names the condition for removing it.
