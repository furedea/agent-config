id: go_iota_enum_typed
language: go
severity: error
message: "Declare the `iota` constant with its own type, e.g. `StatePending State = iota`."
note: "A conversion such as `State(iota)` counts as typed; a call of a builtin such as `max(iota, 1)` does not unless an argument converts `iota`, as in `max(State(iota), 1)`. Whether the type has a `String()` method is not judged. A shift such as `1 << iota` and a blank `_ = iota` that is followed by a typed, converted or shifted constant are skipped; the specs that inherit an untyped `iota` are reported through it."
rule:
  kind: const_spec
  has:
    field: value
    kind: expression_list
    regex: \biota\b
    not:
      regex: <<
  not:
    any:
      - has:
          field: type
          regex: .+
      - has:
          field: value
          regex: ^[A-Za-z_][\w.]*\(.*\biota\b.*\)$
          not:
            regex: ^(min|max|len|cap|complex|real|imag|unsafe\.\w+)\(
      - has:
          field: value
          regex: ^(min|max)\(.*\b[A-Za-z_][\w.]*\(\s*iota\b
      - all:
          - has:
              field: name
              regex: ^_$
          - precedes:
              stopBy:
                kind: const_spec
              all:
                - kind: const_spec
                - any:
                    - has:
                        field: type
                        regex: .+
                    - has:
                        field: value
                        regex: <<
                    - has:
                        field: value
                        regex: ^[A-Za-z_][\w.]*\(.*\biota\b.*\)$
                        not:
                          regex: ^(min|max|len|cap|complex|real|imag|unsafe\.\w+)\(
