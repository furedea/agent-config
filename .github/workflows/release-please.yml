name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

# Consumers follow main and pin a commit in flake.lock, so a release is only a tag, a GitHub release and
# CHANGELOG.md. release-pr publishes the release itself; there are no artifacts for release-publish to attach.
jobs:
  release-pr:
    uses: furedea/reusable-workflows/.github/workflows/release-pr.yml@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0
    permissions: {}
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
