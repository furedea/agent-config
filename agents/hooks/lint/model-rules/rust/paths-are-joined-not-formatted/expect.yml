default: clean
# Lines are the first line of each function; a window of 1 keeps neighbouring subjects apart.
# violating.rs: every subject breaks the rule. conforming.rs: every subject keeps it, and most sit near the boundary
# that the criteria's false side names.
fixtures/violating.rs:
  - { line: 3, label: bad, window: 1 }
  - { line: 7, label: bad, window: 1 }
  - { line: 11, label: bad, window: 1 }
  - { line: 15, label: bad, window: 1 }
  - { line: 19, label: bad, window: 1 }
fixtures/conforming.rs:
  - { line: 3, label: clean, window: 1 }
  - { line: 7, label: clean, window: 1 }
  - { line: 11, label: clean, window: 1 }
  - { line: 15, label: clean, window: 1 }
  - { line: 19, label: clean, window: 1 }
