id: rs_fs_call_needs_context
language: rust
severity: warning
message: "Add context naming the operation and the path to a filesystem call; a bare `?` returns \"No such file or directory\" alone."
ignores:
  - "**/*tests.rs"
  - "**/fixtures.rs"
  - "**/tests/**"
  - "**/test_support.rs"
  - "**/build.rs"
  - "**/fixtures/**"
rule:
  kind: try_expression
  has:
    kind: call_expression
    has:
      field: function
      kind: scoped_identifier
      regex: ^((std::)?fs::[a-z_]+|(std::fs::)?File::(open|create)|(std::fs::)?OpenOptions::new)$
