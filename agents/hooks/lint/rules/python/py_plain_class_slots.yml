id: py_plain_class_slots
language: python
severity: error
message: "A plain class without `__slots__` keeps a per-instance `__dict__`, which costs memory and accepts typo attributes."
note: "Add `__slots__ = (\"name\", \"age\")` listing the attributes set in `__init__` (a class that uses `cached_property` is skipped)."
rule:
  kind: class_definition
  all:
    - not:
        has:
          field: superclasses
          kind: argument_list
    - not:
        inside:
          kind: decorated_definition
          has:
            kind: decorator
            regex: ^@(\w+\.)*(dataclass|define|frozen|mutable|s|attrs)\b
    - has:
        field: body
        kind: block
        has:
          kind: function_definition
          all:
            - has:
                field: name
                regex: ^__init__$
            - has:
                field: body
                kind: block
                has:
                  stopBy: end
                  kind: assignment
                  has:
                    field: left
                    any:
                      - kind: attribute
                        regex: ^self\.
                      - has:
                          stopBy: end
                          kind: attribute
                          regex: ^self\.
    - not:
        has:
          pattern: cached_property
          stopBy: end
    - not:
        all:
          - inside:
              kind: module
              stopBy: end
              has:
                pattern: from functools import cached_property as $CACHED
          - has:
              stopBy: end
              kind: decorator
              pattern: "@$CACHED"
    - not:
        has:
          field: body
          kind: block
          has:
            kind: expression_statement
            regex: ^__slots__\s*(:[^=]*)?=
