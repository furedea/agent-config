# A comment explains why, not what (agents/skills/typescript-style/references/code_style.md). Advisory and unfitted.
id: comment-explains-why
languages: [ TypeScript, Tsx ]
kind: noul
subject: node
# The whole file: a comment outside any function is judged against the code next to it (#196).
state: located
threshold: 0.5
axis: file
severity: warning
rule:
  any:
    - all:
        - any: [ { kind: function_declaration }, { kind: generator_function_declaration } ]
        - has: { kind: comment, stopBy: { any: [ { kind: generator_function_declaration }, { kind: generator_function }, { kind: function_declaration }, { kind: function_expression }, { kind: arrow_function }, { kind: method_definition } ] } }
    - all:
        - kind: method_definition
        - has: { kind: comment, stopBy: { any: [ { kind: generator_function_declaration }, { kind: generator_function }, { kind: function_declaration }, { kind: function_expression }, { kind: arrow_function }, { kind: method_definition } ] } }
    - all:
        - any:
            - kind: arrow_function
            - kind: function_expression
            - kind: generator_function
        - has: { kind: comment, stopBy: { any: [ { kind: generator_function_declaration }, { kind: generator_function }, { kind: function_declaration }, { kind: function_expression }, { kind: arrow_function }, { kind: method_definition } ] } }
    - all:
        - kind: comment
        - not: { regex: '^(/\*\*|//\s*(TODO|FIXME))' }
        - not:
            inside:
              any:
                - kind: function_declaration
                - kind: generator_function_declaration
                - kind: method_definition
                - kind: arrow_function
                - kind: function_expression
                - kind: generator_function
              stopBy: end
ask: >-
  A comment (in this function, or outside any function) restates what the next lines do, where a clearer name, type or
  function boundary would say it without the comment.
criteria:
  "true": >-
    A comment only narrates the statement beside it (for example "loop over the items" or "increment the counter"), or
    explains a confusing step that a better name or a small extracted function would make clear.
  "false": >-
    Every comment gives a reason the code cannot show: a constraint, a workaround for a named defect or tool behaviour, the
    intent behind a non-obvious choice, or a pointer to an issue or decision. A TODO or a documentation comment on a public
    API is not a violation.
