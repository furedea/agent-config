# rust-style/references/types.md (Structs) and package_design.md (Public API Design): keep fields private when the type
# has invariants, validate in a constructor, and do not expose mutable internal collections. Advisory.
id: public-types-protect-invariants
language: Rust
kind: noul
subject: node
# The constructors, validation and impls that make a field's invariant are elsewhere in the file.
state: located
# Fitted by `jev-lint eval` on this rule's own fixtures (10 cases, 5 bad and 5 clean, over 3 passes; baseline of
# 2026-11-18): the highest clean case scored 0.24 (conforming.rs:23) and the lowest violation 0.83 (violating.rs:61);
# the cutoff is jev-lint's fitted midpoint of that gap. A fit on so few cases is a starting point, not a calibration
# (ADR-0020), so the rule stays advisory.
threshold: 0.53
# Every clean case answers far below the cutoff and every bad case far above it, so this corpus cannot see the rule
# drift; boundary cases need code a reviewer would argue over.
inconclusive: >-
  Blind: the fixtures are clearly clean or clearly defective (the gap runs from 0.24 to 0.83), and no
  boundary fixture exists yet.
axis: file
severity: warning
rule:
  all:
    - kind: struct_item
    - any:
        - has:
            kind: field_declaration_list
            has:
              kind: field_declaration
              has:
                kind: visibility_modifier
        # A tuple struct: `pub struct Port(pub u16);`
        - has:
            kind: ordered_field_declaration_list
            has:
              kind: visibility_modifier
ask: >-
  This type has a public field that holds a mutable collection, or a public field whose value must satisfy an
  invariant that the type's own constructor or `parse` function checks.
criteria:
  "true": >-
    A caller can break a rule the type depends on by writing the public field directly: an invariant checked in a
    constructor or `parse` function (non-empty, sorted, unique, in range) is bypassed, or a collection that the type
    treats as its own state is exposed for mutation.
  "false": >-
    The struct is a plain data carrier with no invariant (a configuration, an options struct, a result record) whose
    fields can hold any value, or the field is not public outside the crate and has no invariant.
