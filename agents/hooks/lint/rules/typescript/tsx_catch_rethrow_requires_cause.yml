id: tsx_catch_rethrow_requires_cause
language: tsx
severity: error
message: "Pass the caught error as `cause`: `new Error(message, { cause })`."
note: "The `.tsx` counterpart of ts_catch_rethrow_requires_cause; ast-grep parses `.tsx` files as the separate `tsx` language. Only a one-argument `new XError(message)` thrown inside a `catch` is reported; a function declared inside the `catch` is a new scope."
rule:
  all:
    - any:
        - pattern: new $ERROR($MESSAGE)
        - pattern: new $ERROR($MESSAGE, $OPTIONS)
    - inside:
        kind: throw_statement
        inside:
          any:
            - kind: catch_clause
              has: { field: parameter, regex: '.' }
            - all:
                - any:
                    - kind: arrow_function
                    - kind: function_expression
                - inside:
                    kind: arguments
                    inside:
                      kind: call_expression
                      has: { field: function, kind: member_expression, regex: '\.catch$' }
          stopBy:
            any:
              - kind: function_declaration
              - kind: function_expression
              - kind: arrow_function
              - kind: method_definition
constraints:
  ERROR: { regex: Error$ }
  OPTIONS:
    kind: object
    not: { regex: '\bcause\b' }
