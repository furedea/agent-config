id: gha_pinned_uses_version_comment
language: yaml
severity: error
message: "An action pinned to a SHA without a version comment hides which release it is from readers and update tools."
note: "Append the version after the SHA, e.g. `uses: actions/checkout@<sha> # v4.2.1`."
files:
  - "**/.github/workflows/**"
  - "**/action.yml"
  - "**/action.yaml"
# Scope: Local actions (`./path`) and tag references are not checked: the first has no version to record, and the second is rejected by zizmor's unpinned-uses.
rule:
  any:
    - kind: block_mapping_pair
      all:
        - has:
            field: key
            regex: ^["']?uses["']?$
        - has:
            field: value
            regex: "@[0-9a-f]{40}[\"']?$"
      not:
        precedes:
          stopBy: neighbor
          kind: comment
          regex: ^#\s*v?\d
    # A flow mapping's comment follows the closing brace, so it is the mapping that is checked.
    - kind: flow_pair
      all:
        - has:
            field: key
            regex: ^["']?uses["']?$
        - has:
            field: value
            regex: "@[0-9a-f]{40}[\"']?$"
      not:
        inside:
          stopBy: end
          precedes:
            stopBy: neighbor
            kind: comment
            regex: ^#\s*v?\d
