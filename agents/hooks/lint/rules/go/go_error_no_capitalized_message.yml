id: go_error_no_capitalized_message
language: go
severity: warning
message: "Start the error message with a lowercase letter."
note: "A message that starts with an initialism (`HTTP 500`) is skipped: only a capital followed by a lowercase letter or a space matches."
rule:
  any:
    - pattern: fmt.Errorf($MSG, $$$ARGS)
    - pattern:
        context: "func f() { fmt.Errorf($MSG) }"
        selector: call_expression
    - pattern:
        context: "func f() { errors.New($MSG) }"
        selector: call_expression
constraints:
  MSG:
    regex: ^["`][A-Z]([a-z]|\s)
