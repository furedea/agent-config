id: go_iota_enum_typed
language: go
severity: error
message: "Declare the `iota` constant with its own type, e.g. `StatePending State = iota`."
note: "Only the plain forms `X = iota` and `X = iota + N` are judged; any other value (a conversion, a builtin call, a shift, a list of values) is skipped, so the rule has no false positive on them. A blank `_ = iota` is judged only when the next spec writes neither a type nor a value of its own. Whether the type has a `String()` method is not judged."
rule:
  kind: const_spec
  has:
    field: value
    kind: expression_list
    regex: ^iota(\s*[-+*/]\s*\w+)?$
  not:
    any:
      - has:
          field: type
          regex: .+
      - all:
          - has:
              field: name
              regex: ^_$
          - precedes:
              stopBy:
                kind: const_spec
              all:
                - kind: const_spec
                - any:
                    - has:
                        field: type
                        regex: .+
                    - has:
                        field: value
                        regex: .+
