id: go_error_no_string_matching
source:
  link: agents/skills/go-style/references/errors.md#L6
  quote: "Compare with `errors.Is` and `errors.As`, never `==` or string matching"
language: go
method: ast-grep
version: 1
examples:
  conforming:
    - |
      func missing(err error) bool {
          return errors.Is(err, fs.ErrNotExist)
      }
  violating:
    - |
      func missing(err error) bool {
          return strings.Contains(err.Error(), "no such file")
      }
severity: warning
message: "Compare with `errors.Is` or `errors.As` instead of matching the message text."
note: "Test files are skipped because tests may assert the exact message of an error they create."
ignores:
  - "**/*_test.go"
rule:
  any:
    - pattern: $ERR.Error() == $TEXT
    - pattern: $ERR.Error() != $TEXT
    - pattern: strings.Contains($ERR.Error(), $TEXT)
    - pattern: strings.HasPrefix($ERR.Error(), $TEXT)
    - pattern: strings.HasSuffix($ERR.Error(), $TEXT)
