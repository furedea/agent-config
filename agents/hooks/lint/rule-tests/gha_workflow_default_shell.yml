id: gha_workflow_default_shell
valid:
  - |
    defaults:
      run:
        shell: bash
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - run: echo hi
  - |
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - run: echo hi
  - |
    jobs:
      call:
        uses: owner/repo/.github/workflows/lint.yml@main
invalid:
  - |
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - run: echo hi
  - |
    defaults:
      run:
        working-directory: app
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - run: echo hi
  - |
    defaults:
      run:
        shell: sh
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - run: echo hi
  - |
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - run: |
              echo hi
